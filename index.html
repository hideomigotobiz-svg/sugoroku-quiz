:"spi","question":"「気が置けない友人」などと使う「気が置けない」。本来の意味はどれ？","display":"「気が置けない」の本来の意味は？","answer":"遠慮がいらない","accept_rule":"「遠慮がいらない（気をつかわなくてよい）」のみ正解","explanation":"「気が置けない」は遠慮や気づかいの必要がなく、打ち解けられること。「油断できない」の意味で使うのは誤用で、文化庁の調査でも本来の意味と答えた人は半数以下。","formats":["choice4","flip"],"choices":["遠慮がいらない","油断できない","頼りにならない","話が合わない"],"expected_correct_rate":0.52},{"id":"spi-611","genre":"spi","question":"フリップに漢字で書いてください。「事故の被害者に、ほしょう金を支払う」の「ほしょう」。","display":"事故の被害者に\nほしょう金を支払う","answer":"補償","accept_rule":"「補償」のみ正解。「保証」「保障」は不正解","explanation":"損害や損失を埋め合わせるのが「補償」（償＝つぐなう）。「保証」は確かだと請け合うこと、「保障」は安全や権利を守ること。","formats":["flip"],"expected_correct_rate":0.5}]};</script>
<script>
// 効果音とBGM。すべて Web Audio で合成するので音源ファイル不要・オフラインで鳴る
(function () {
  let ctx = null, master, comp, seBus, bgmBus, duck, noiseBuf;
  const vol = { se: 0.8, bgm: 0.7 };
  let muted = false;

  function unlock() {
    try {
      if (navigator.audioSession) navigator.audioSession.type = 'playback';
    } catch (e) { /* 非対応ブラウザ */ }
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      // 会場スピーカーで鳴らす前提で音圧を上げ、コンプレッサーで音割れを防ぐ
      comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 8; comp.ratio.value = 4;
      comp.attack.value = 0.004; comp.release.value = 0.2;
      master = ctx.createGain(); master.gain.value = 1.4;
      master.connect(comp); comp.connect(ctx.destination);
      seBus = ctx.createGain(); seBus.gain.value = vol.se; seBus.connect(master);
      duck = ctx.createGain(); duck.connect(master);
      bgmBus = ctx.createGain(); bgmBus.gain.value = vol.bgm; bgmBus.connect(duck);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume();
    return true;
  }

  function ready() { return !!ctx && ctx.state === 'running'; }

  function tone(freq, start, dur, opt = {}) {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = opt.type || 'sine';
    o.frequency.setValueAtTime(freq, start);
    if (opt.glide) o.frequency.exponentialRampToValueAtTime(opt.glide, start + dur);
    const peak = opt.gain ?? 0.3;
    const a = opt.attack ?? 0.005;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(peak, start + a);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    let node = o;
    if (opt.lowpass) {
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = opt.lowpass;
      o.connect(f); node = f;
    }
    node.connect(g); g.connect(opt.bus || seBus);
    o.start(start); o.stop(start + dur + 0.05);
  }

  function noise(start, dur, opt = {}) {
    const s = ctx.createBufferSource();
    s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = opt.filter || 'highpass'; f.frequency.value = opt.freq || 6000;
    if (opt.sweep) f.frequency.exponentialRampToValueAtTime(opt.sweep, start + dur);
    const g = ctx.createGain();
    const peak = opt.gain ?? 0.2;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(peak, start + (opt.attack ?? 0.003));
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    s.connect(f); f.connect(g); g.connect(opt.bus || seBus);
    s.start(start, Math.random()); s.stop(start + dur + 0.05);
  }

  function kick(t, bus, gain = 0.9) { tone(150, t, 0.28, { gain, glide: 45, bus }); }

  function duckBgm(sec) {
    const t = ctx.currentTime;
    duck.gain.cancelScheduledValues(t);
    duck.gain.setTargetAtTime(0.35, t, 0.03);
    duck.gain.setTargetAtTime(1, t + sec, 0.25);
  }

  const SE = {
    question(t) { // 出題「ポロロン」
      [784, 1047, 1319, 1568].forEach((f, i) => {
        tone(f, t + i * 0.055, 0.4, { type: 'triangle', gain: 0.22 });
        tone(f * 2, t + i * 0.055, 0.15, { gain: 0.05 });
      });
      return 0.5;
    },
    correct(t) { // ピンポーン
      tone(1318.5, t, 0.5, { gain: 0.38 }); tone(2637, t, 0.25, { gain: 0.07 });
      tone(1046.5, t + 0.2, 0.9, { gain: 0.38 }); tone(2093, t + 0.2, 0.4, { gain: 0.07 });
      return 0.9;
    },
    wrong(t) { // ブッブー
      tone(155, t, 0.24, { type: 'sawtooth', gain: 0.22, lowpass: 1100, attack: 0.01 });
      tone(155, t + 0.3, 0.42, { type: 'sawtooth', gain: 0.22, lowpass: 1100, attack: 0.01 });
      return 0.8;
    },
    reveal(t) { // 正解オープン「ジャン！」
      [523.25, 659.25, 783.99, 1046.5].forEach(f => tone(f, t, 0.7, { type: 'sawtooth', gain: 0.08, lowpass: 3600 }));
      tone(130.8, t, 0.5, { type: 'triangle', gain: 0.3 });
      noise(t, 0.4, { freq: 6000, gain: 0.1 });
      return 0.7;
    },
    tick(t) { tone(1600, t, 0.05, { gain: 0.12 }); return 0.05; },
    dice(t) { // サイコロがカラカラ転がる音（約1.1秒）
      for (let i = 0; i < 12; i++) {
        const d = t + i * 0.09 * (1 + i / 24);
        noise(d, 0.035, { filter: 'bandpass', freq: 2200 + (i % 3) * 600, gain: 0.16 - i * 0.008 });
        tone(900 + (i % 4) * 140, d, 0.03, { type: 'triangle', gain: 0.06 });
      }
      return 1.1;
    },
    step(t) { tone(740, t, 0.07, { type: 'triangle', gain: 0.14 }); tone(1110, t + 0.06, 0.08, { type: 'triangle', gain: 0.1 }); return 0.15; },
    timeup(t) { tone(392, t, 0.9, { type: 'sawtooth', gain: 0.16, lowpass: 1600, attack: 0.01 }); return 0.9; },
    round(t) { // ラウンド開始「シュワッ→ジャーン」
      noise(t, 0.45, { filter: 'bandpass', freq: 400, sweep: 6000, gain: 0.14, attack: 0.3 });
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(f => tone(f, t + 0.42, 1.0, { type: 'sawtooth', gain: 0.06, lowpass: 4000 }));
      kick(t + 0.42, seBus, 0.7);
      return 1.4;
    },
    drum(t) { // ドラムロール→シンバル（約1.8秒）
      const n = 28;
      for (let i = 0; i < n; i++) noise(t + i * 0.05, 0.06, { filter: 'bandpass', freq: 1800, gain: 0.05 + (i / n) * 0.2 });
      const end = t + n * 0.05;
      noise(end, 1.4, { freq: 5000, gain: 0.26 });
      kick(end, seBus, 0.9);
      return n * 0.05 + 1.2;
    },
    fanfare(t) {

    const W = '#F7F4EC', RF = '#46565F', RS = '#1E272C', ST = '#B4AFA2';
    const roof = (hw, y, h, lift) => `<path d="M${cx - hw - 7} ${y} Q${cx - hw + 2} ${y - h * 0.3} ${cx - hw + 9} ${y - h} H${cx + hw - 9} Q${cx + hw - 2} ${y - h * 0.3} ${cx + hw + 7} ${y} Q${cx} ${y - lift} ${cx - hw - 7} ${y} Z" fill="${RF}" stroke="${RS}" stroke-width="1.4" stroke-linejoin="round"/>`;
    const wall = (hw, y, h) => `<rect x="${cx - hw}" y="${y - h}" width="${hw * 2}" height="${h}" fill="${W}" stroke="${RS}" stroke-width="1.4"/>`;
    const win = (x, y) => `<rect x="${cx + x - 2.5}" y="${y}" width="5" height="6" fill="${RS}"/>`;
    return `<g>
      <ellipse cx="${cx}" cy="${by + 2}" rx="64" ry="7" fill="#000" opacity=".12"/>
      <path d="M${cx - 96} ${by - 2} v-13 h44 v13 Z M${cx + 52} ${by - 2} v-13 h44 v13 Z" fill="${W}" stroke="${RS}" stroke-width="1.2"/>
      <path d="M${cx - 99} ${by - 15} h50 l-3 -5 h-44 Z M${cx + 49} ${by - 15} h50 l-3 -5 h-44 Z" fill="${RF}" stroke="${RS}" stroke-width="1.2"/>
      <path d="M${cx - 54} ${by} L${cx - 43} ${by - 32} H${cx + 43} L${cx + 54} ${by} Z" fill="${ST}" stroke="#4A463E" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M${cx - 49} ${by - 10} h20 m6 0 h28 m7 0 h30 M${cx - 45} ${by - 21} h14 m7 0 h24 m6 0 h31 M${cx - 30} ${by - 10} v-11 M${cx + 6} ${by - 10} v-11 M${cx + 30} ${by} v-10 M${cx - 12} ${by} v-10 M${cx + 22} ${by - 21} v-11 M${cx - 22} ${by - 21} v-11" stroke="#4A463E" stroke-width="1" opacity=".55" fill="none"/>
      <path d="M${cx - 9} ${by} v-15 a9 9 0 0 1 18 0 v15 Z" fill="#3A2A1C" stroke="${RS}" stroke-width="1.2"/>
      ${wall(35, by - 32, 20)}${win(-22, by - 46)}${win(-8, by - 46)}${win(8, by - 46)}${win(22, by - 46)}
      ${roof(37, by - 50, 13, 7)}
      <path d="M${cx - 11} ${by - 60} L${cx} ${by - 72} L${cx + 11} ${by - 60} Z" fill="${W}" stroke="${RS}" stroke-width="1.3" stroke-linejoin="round"/>
      ${wall(25, by - 63, 16)}${win(-13, by - 75)}${win(0, by - 75)}${win(13, by - 75)}
      ${roof(27, by - 78, 12, 6)}
      ${wall(15, by - 90, 13)}${win(-6, by - 100)}${win(6, by - 100)}
      <path d="M${cx - 25} ${by - 102} Q${cx - 12} ${by - 108} ${cx} ${by - 124} Q${cx + 12} ${by - 108} ${cx + 25} ${by - 102} Q${cx} ${by - 108} ${cx - 25} ${by - 102} Z" fill="${RF}" stroke="${RS}" stroke-width="1.4" stroke-linejoin="round"/>
      <path d="M${cx - 6} ${by - 119} q-4 -5 -1 -8 M${cx + 6} ${by - 119} q4 -5 1 -8" stroke="#D9A400" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>`;
  }

  // サイコロ（CSS の立方体）。1 の目は赤
  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  const SHOW = { 1: [0, 0], 2: [90, 0], 3: [0, -90], 4: [0, 90], 5: [-90, 0], 6: [0, 180] };
  const faceHTML = n => `<div class="f f${n}">${Array.from({ length: 9 }, (_, i) => `<i${PIPS[n].includes(i) ? ' class="p"' : ''}></i>`).join('')}</div>`;
  const dieHTML = (cls = '') => `<div class="die ${cls}"><div class="cube">${[1, 2, 3, 4, 5, 6].map(faceHTML).join('')}</div><div class="shade"><i class="sf"></i><i class="st"></i><i class="sr"></i></div></div>`;
  const flatDie = n => `<span class="die2d">${faceHTML(n)}</span>`;

  // ---------- 地図の SVG ----------
  function mapSVG(board) {
    const { nodes, H, len } = geo(board);
    let seed = board.seed || 1;
    const rand = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    const R = (a, b) => a + rand() * (b - a);
    const pick = a => a[Math.floor(rand() * a.length)];
    const density = len / 20;
    const bandY = r => (r <= 0 ? H : r >= 6 ? 0 : H - PAD_B - (r * len / 6) * DY + DY / 2);
    // 道の点列（飾りを道から離すのに使う）
    const road = [];
    for (let i = 0; i < len; i++) for (let t = 0; t < 1; t += 0.2) road.push(roadPt(nodes, i, t));
    road.push(nodes[len]);
    const roadX = y => road.reduce((a, b) => (Math.abs(b.y - y) < Math.abs(a.y - y) ? b : a)).x;
    const hitRoad = (x, y, d) => road.some(p => (p.x - x) ** 2 + (p.y - y) ** 2 < d * d);
    const labelW = i => { const s = cellInfo(board.cells[i]).label; return 20 + s.length * 11.5; };
    const labels = nodes.map((n, i) => (n.x < MAP_W / 2 ? { x0: n.x + 14, x1: n.x + 24 + labelW(i), y: n.y } : { x0: n.x - 24 - labelW(i), x1: n.x - 14, y: n.y }));
    const hitLabel = (x, y, rad, h) => labels.some(L => y > L.y - 12 && y - h < L.y + 10 && x > L.x0 - rad && x < L.x1 + rad);
    // 大河
    const ry0 = (bandY(2) + bandY(3)) / 2, rk = R(0, 6);
    const riverY = x => ry0 + 11 * Math.sin(x / 62 + rk);
    const nearRiver = (x, y, m) => Math.abs(y - riverY(x)) < 33 + m;
    const taken = [];
    const free = (x, y, rad, h = 0) => x > rad * 0.6 && x < MAP_W - rad * 0.6
      && !hitRoad(x, y, rad + 15) && !(h > 14 && hitRoad(x, y - h * 0.6, rad + 13))
      && !hitLabel(x, y, rad, h) && !nearRiver(x, y, rad * 0.5)
      && !taken.some(o => (o.x - x) ** 2 + (o.y - y) ** 2 < (o.r + rad) ** 2);
    const objs = []; // 立っているもの（下にあるほど手前）
    let ground = ''; // 地面に貼りつくもの
    const place = (r, n, rad, h, draw, opt = {}) => {
      n = Math.round(n * density);
      const y1 = bandY(r + 1) + (r === 5 ? PAD_T - 40 : 10) + h * 0.5, y0 = bandY(r) - 8;
      for (let i = 0, tries = 0; i < n && tries < n * 40; tries++) {
        const x = opt.edge ? (rand() < 0.5 ? R(8, 70) : R(MAP_W - 70, MAP_W - 8)) : R(8, MAP_W - 8), y = R(y1, y0);
        if (!free(x, y, rad, h)) continue;
        taken.push({ x, y, r: rad * (opt.pack || 1) });
        if (opt.flat) ground += draw(f1(x), f1(y)); else objs.push({ y, s: draw(f1(x), f1(y)) });
        i++;
      }
    };
    const U = (id, x, y, s = 1, flip = false) => `<use href="#${id}" transform="translate(${x} ${y}) scale(${flip ? -s : s} ${s})"/>`;

    let out = `<defs>
      <pattern id="m-dot" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".7" fill="#000" opacity=".05"/></pattern>
      <pattern id="m-paddy" width="6" height="5" patternUnits="userSpaceOnUse"><rect width="6" height="5" fill="#B9D98A"/><path d="M1.5 4 v-2.6 M4.5 4.6 v-2.6" stroke="#6FA04B" stroke-width="1"/></pattern>
      <pattern id="m-stripe" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff"/><rect width="4" height="8" fill="#E60012"/></pattern>
      <g id="t-pine"><ellipse cy="1" rx="9" ry="3" opacity=".14"/><rect x="-1.6" y="-6" width="3.2" height="7" fill="#6B4A2B"/><path d="M0 -33 L8 -19 H4.5 L11 -8 H-11 L-4.5 -19 H-8 Z" fill="#33734A"/><path d="M0 -33 L8 -19 H4.5 L11 -8 H0 Z" fill="#255A38"/></g>
      <g id="t-cedar"><ellipse cy="1" rx="7" ry="2.6" opacity=".14"/><rect x="-1.4" y="-5" width="2.8" height="6" fill="#6B4A2B"/><path d="M0 -38 Q9 -18 7 -6 H-7 Q-9 -18 0 -38Z" fill="#2B6A4B"/><path d="M0 -38 Q9 -18 7 -6 H0Z" fill="#1F5139"/></g>
      <g id="t-oak"><ellipse cy="1" rx="11" ry="3.2" opacity=".14"/><rect x="-2" y="-10" width="4" height="11" fill="#7A5534"/><circle cy="-19" r="11" fill="#63A64C"/><circle cx="-6" cy="-14" r="7" fill="#63A64C"/><circle cx="6.5" cy="-14" r="7.5" fill="#4C8C3E"/><circle cx="-3.5" cy="-22" r="4.2" fill="#86C267"/></g>
      <g id="t-sakura"><ellipse cy="1" rx="11" ry="3.2" opacity=".14"/><path d="M-1.6 1 L-1 -10 L-5 -15 M1.6 1 L1 -10 L5 -14" stroke="#5E4030" stroke-width="2.4" fill="none"/><circle cy="-20" r="10.5" fill="#F6B4C9"/><circle cx="-7" cy="-14" r="6.5" fill="#F6B4C9"/><circle cx="7" cy="-15" r="7" fill="#EE95B3"/><circle cx="-3" cy="-23" r="4" fill="#FCDCE6"/></g>
      <g id="t-bush"><ellipse cy="1" rx="8" ry="2.4" opacity=".14"/><circle cx="-4" cy="-3" r="5" fill="#5C9E48"/><circle cx="3" cy="-4" r="6" fill="#6DB055"/></g>
      <g id="h-a"><ellipse cy="1.5" rx="15" ry="3" opacity=".14"/><rect x="-11" y="-11" width="22" height="12" fill="#F6F1E4" stroke="#3E3226" stroke-width="1"/><path d="M-11 -4 h22" stroke="#3E3226" stroke-width="3.4" opacity=".75"/><rect x="-3" y="-6.5" width="6" height="7.5" fill="#7A5534"/><path d="M-15 -10 L-9 -20 H9 L15 -10 Z" fill="#4B5861" stroke="#232B30" stroke-width="1" stroke-linejoin="round"/><path d="M-9 -20 H9" stroke="#232B30" stroke-width="2.2" stroke-linecap="round"/></g>
      <g id="h-b"><ellipse cy="1.5" rx="16" ry="3" opacity=".14"/><rect x="-12" y="-10" width="24" height="11" fill="#C79A63" stroke="#3E3226" stroke-width="1"/><path d="M-8 -9 v9 M-4 -9 v9 M8 -9 v9 M4 -9 v9" stroke="#8C6638" stroke-width="1"/><rect x="-3.5" y="-9" width="7" height="4.5" fill="#E60012"/><rect x="-3.5" y="-4.5" width="7" height="5.5" fill="#3A2A1C"/><path d="M-16 -9 L-10 -18 H10 L16 -9 Z" fill="#6A6F58" stroke="#2C3024" stroke-width="1" stroke-linejoin="round"/></g>
      <g id="h-c"><ellipse cy="1.5" rx="11" ry="2.6" opacity=".14"/><rect x="-8" y="-18" width="16" height="19" fill="#FBF8F0" stroke="#232B30" stroke-width="1"/><rect x="-8" y="-5" width="16" height="6" fill="#39424A"/><rect x="-2" y="-14" width="4" height="5" fill="#232B30"/><path d="M-11 -17 L0 -27 L11 -17 Z" fill="#39424A" stroke="#232B30" stroke-width="1" stroke-linejoin="round"/></g>
      <g id="rock"><path d="M-7 1 L-5 -5 L1 -8 L7 -3 L8 1 Z" fill="#9B978C" stroke="#5F5B52" stroke-width="1" stroke-linejoin="round"/><path d="M1 -8 L7 -3 L8 1 H2 Z" fill="#7F7B71"/></g>
      <g id="tuft"><path d="M-5 0 l2.5 -7 l2 6 l2.5 -8 l2 9" stroke="#6E9E4C" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
      <g id="flw"><circle cx="-3" r="1.9" fill="#fff"/><circle cx="2.5" cy="-2.5" r="1.9" fill="#F7D441"/><circle cx="3" cy="2.5" r="1.9" fill="#F08BA0"/></g>
      <g id="reed"><path d="M-3 0 q-1 -8 -3 -11 M0 0 v-13 M3 0 q1 -7 4 -10" stroke="#5F8F45" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M0 -13 v-4" stroke="#7A5534" stroke-width="2.4" stroke-linecap="round"/></g>
      <g id="lantern"><rect x="-1.2" y="-9" width="2.4" height="10" fill="#77736A"/><rect x="-3.5" y="-15" width="7" height="6" fill="#F7E7A6" stroke="#55514A" stroke-width="1"/><path d="M-5.5 -15 L0 -19 L5.5 -15 Z" fill="#55514A"/></g>
    </defs>`;

    // 地面（地域ごとに色を変え、境目は波打たせる）
    const edge = (y0, k) => { let s = ''; for (let x = 0; x <= MAP_W; x += 24) s += `${x ? 'L' : 'M'}${x} ${f1(y0 + 6 * Math.sin(x / 38 + k) + 3 * Math.sin(x / 13 + k * 3))}`; return s; };
    out += `<rect width="${MAP_W}" height="${H}" fill="${REGIONS[5].bg}"/>`;
    for (let r = 4; r >= 0; r--) {
      const e = edge(bandY(r + 1), r * 1.7 + rk);
      out += `<path d="${e} L${MAP_W} ${H} L0 ${H} Z" fill="${REGIONS[r].bg}"/><path d="${e}" fill="none" stroke="#000" stroke-opacity=".13" stroke-width="1.2"/>`;
    }
    // 地面の濃淡
    const patch = (r, n, col) => { for (let i = 0; i < Math.round(n * density); i++) { const x = R(0, MAP_W), y = R(bandY(r + 1) + 26, bandY(r) - 22); out += `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(R(28, 60))}" ry="${f1(R(10, 20))}" fill="${col}" opacity=".5"/>`; } };
    patch(0, 5, '#DAEBB6'); patch(1, 5, '#8AB86F'); patch(3, 4, '#F0E3BE'); patch(4, 4, '#BAB2A0'); patch(5, 2, '#EFEBDD');
    // 山の等高線
    for (let i = 0; i < Math.round(5 * density); i++) {
      const x = R(20, MAP_W - 20), y = R(bandY(5) + 30, bandY(4) - 26), a = R(26, 50);
      out += `<path d="M${f1(x - a)} ${f1(y)} q${f1(a * 0.5)} ${f1(-a * 0.5)} ${f1(a)} ${f1(-a * 0.2)} t${f1(a)} ${f1(a * 0.25)}" fill="none" stroke="#6F675A" stroke-opacity=".28" stroke-width="1"/>`;
    }
    out += `<rect width="${MAP_W}" height="${H}" fill="url(#m-dot)"/>`;

    // 川（砂州 → 水 → 浅瀬 → 流れの筋）
    let rd = '';
    for (let x = -12; x <= MAP_W + 12; x += 16) rd += `${x < 0 ? 'M' : 'L'}${x} ${f1(riverY(x))}`;
    out += `<path d="${rd}" fill="none" stroke="#DCCB96" stroke-width="58" stroke-linejoin="round"/>
      <path d="${rd}" fill="none" stroke="#4E9CC6" stroke-width="48" stroke-linejoin="round"/>
      <path d="${rd}" fill="none" stroke="#69B2D8" stroke-width="36" stroke-linejoin="round"/>
      <path d="${rd}" fill="none" stroke="#E9F6FB" stroke-width="1.6" stroke-dasharray="16 22" stroke-linecap="round" transform="translate(0 -9)" opacity=".9"/>
      <path d="${rd}" fill="none" stroke="#E9F6FB" stroke-width="1.6" stroke-dasharray="10 26" stroke-dashoffset="14" stroke-linecap="round" transform="translate(0 3)" opacity=".8"/>
      <path d="${rd}" fill="none" stroke="#E9F6FB" stroke-width="1.6" stroke-dasharray="20 30" stroke-dashoffset="5" stroke-linecap="round" transform="translate(0 13)" opacity=".7"/>`;
    // 橋の位置（道が川を横切る点）と向き
    let bridge = null;
    for (let i = 0; i < len && !bridge; i++) {
      for (let t = 0; t < 1; t += 0.02) {
        const p = roadPt(nodes, i, t), q = roadPt(nodes, i, t + 0.02);
        if ((p.y - riverY(p.x)) * (q.y - riverY(q.x)) <= 0) { bridge = { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2, a: Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI }; break; }
      }
    }
    // 川の岩と小舟
    for (let i = 0; i < 4; i++) {
      const x = R(16, MAP_W - 16), y = riverY(x) + R(-14, 14);
      if (bridge && Math.abs(x - bridge.x) < 50) continue;
      out += i === 0 ? `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(R(-14, 14))})"><path d="M-13 -3 Q0 3 13 -3 L9 4 H-9 Z" fill="#8C5A2E" stroke="#4A2E16" stroke-width="1" stroke-linejoin="round"/><path d="M-8 -1 H8" stroke="#D9B27A" stroke-width="1.6"/></g>` : U('rock', f1(x), f1(y), R(0.7, 1));
    }

    // 看板（地域の名前）
    const sign = (x, y, name) => {
      const w = name.length * 11.5 + 18;
      x = clamp(x, w / 2 + 6, MAP_W - w / 2 - 6);
      taken.push({ x: x - w / 3, y: y - 6, r: 20 }, { x: x + w / 3, y: y - 6, r: 20 }, { x, y: y - 6, r: 20 });
      objs.push({ y: y + 14, s: `<g><ellipse cx="${x}" cy="${y + 15}" rx="${w * 0.3}" ry="2.6" opacity=".14"/><path d="M${x - w * 0.28} ${y - 2} v17 M${x + w * 0.28} ${y - 2} v17" stroke="#5B3A1E" stroke-width="3" stroke-linecap="round"/>
        <rect x="${x - w / 2}" y="${y - 19}" width="${w}" height="21" rx="2" fill="#5B3A1E"/><rect x="${x - w / 2 + 1.5}" y="${y - 17.5}" width="${w - 3}" height="16" rx="1" fill="#F2DFB0"/>
        <path d="M${x - w / 2 + 5} ${y - 6.5} h${w - 10}" stroke="#C9A86C" stroke-width=".8" opacity=".7"/>
        <text x="${x}" y="${y - 5}" class="sg" text-anchor="middle">${name}</text></g>` });
    };
    REGIONS.forEach((rg, r) => {
      const y = r === 0 ? H - 44 : bandY(r) - 26;
      const side = roadX(y - 8) < MAP_W / 2 ? MAP_W - 62 : 62;
      sign(side, y, rg.name);
    });
    // 城とそのまわり
    const gl = nodes[len];
    const ccx = clamp(gl.x + (gl.x < MAP_W / 2 ? 34 : -34), 108, MAP_W - 108), cby = gl.y - 58;
    for (let dx = -84; dx <= 84; dx += 28) for (let dy = -100; dy <= 0; dy += 34) taken.push({ x: ccx + dx, y: cby + dy, r: 24 });
    objs.push({ y: cby, s: castleSVG(ccx, cby) });
    // スタートの広場（踏み固めた土）と旗
    const st = nodes[0];
    out += `<ellipse cx="${st.x}" cy="${st.y + 6}" rx="52" ry="26" fill="#E2C88E" stroke="#7A5C34" stroke-width="2"/><ellipse cx="${st.x}" cy="${st.y + 5}" rx="44" ry="20" fill="#EEDCAE"/>`;
    const fgx = st.x + (st.x < MAP_W / 2 ? -58 : 58);
    objs.push({ y: st.y + 12, s: `<g><ellipse cx="${fgx}" cy="${st.y + 13}" rx="7" ry="2.4" opacity=".16"/><path d="M${fgx} ${st.y + 12} v-50" stroke="#4A341F" stroke-width="3" stroke-linecap="round"/><path d="M${fgx + 1.5} ${st.y - 37} h26 l-6 8.5 l6 8.5 h-26 Z" fill="#E60012" stroke="${INK}" stroke-width="1.4" stroke-linejoin="round"/></g>` });
    taken.push({ x: fgx, y: st.y - 10, r: 22 }, { x: fgx + 16, y: st.y - 30, r: 16 }, { x: st.x, y: st.y + 8, r: 56 });

    // 草原
    place(0, 3, 13, 30, (x, y) => U('t-oak', x, y, R(0.85, 1.1)));
    place(0, 3, 9, 8, (x, y) => U('t-bush', x, y, R(0.8, 1.1)));
    place(0, 1, 16, 30, (x, y) => `<g transform="translate(${x} ${y})"><ellipse cy="1.5" rx="13" ry="3" opacity=".14"/><path d="M-7 1 L-5 -17 H5 L7 1 Z" fill="#F6F1E4" stroke="#3E3226" stroke-width="1" stroke-linejoin="round"/><path d="M-6.5 -17 L0 -24 L6.5 -17 Z" fill="#C0453A" stroke="#3E3226" stroke-width="1" stroke-linejoin="round"/><path d="M0 -19 L-13 -30 M0 -19 L12 -31 M0 -19 L-11 -7 M0 -19 L13 -9" stroke="#3E3226" stroke-width="1.6" stroke-linecap="round"/><circle cy="-19" r="1.8" fill="#3E3226"/></g>`);
    place(0, 2, 15, 0, (x, y) => `<g transform="translate(${x} ${y})"><ellipse rx="15" ry="7.5" fill="#DCCB96"/><ellipse rx="12.5" ry="5.6" fill="#69B2D8"/><path d="M-6 -1 q3 -2 6 0 M1 2 q3 -2 6 0" stroke="#E9F6FB" stroke-width="1.2" fill="none"/></g>`, { flat: true });
    place(0, 3, 12, 6, (x, y) => `<path d="M${x - 12} ${y} v-7 M${x} ${y} v-7 M${x + 12} ${y} v-7 M${x - 14} ${y - 5} h28 M${x - 14} ${y - 2} h28" stroke="#8C6A45" stroke-width="1.6" stroke-linecap="round" fill="none"/>`);
    place(0, 14, 5, 0, (x, y) => U('tuft', x, y), { flat: true });
    place(0, 13, 5, 0, (x, y) => U('flw', x, y), { flat: true });
    // 森（針葉樹を密に）
    place(1, 15, 9, 34, (x, y) => U(rand() < 0.45 ? 't-cedar' : 't-pine', x, y, R(0.85, 1.2)), { pack: 0.62 });
    place(1, 6, 11, 30, (x, y) => U('t-oak', x, y, R(0.9, 1.15)), { pack: 0.7 });
    place(1, 4, 7, 6, (x, y) => `<g transform="translate(${x} ${y})"><ellipse cy="1" rx="6" ry="2" opacity=".14"/><rect x="-4" y="-5" width="8" height="6" fill="#8C6A45" stroke="#4A341F" stroke-width="1"/><ellipse cy="-5" rx="4" ry="1.6" fill="#D9B27A" stroke="#4A341F" stroke-width=".8"/></g>`);
    place(1, 5, 5, 0, (x, y) => `<g transform="translate(${x} ${y})"><rect x="-1" y="-3" width="2" height="4" fill="#F2EBDD"/><path d="M-4 -3 a4 3.4 0 0 1 8 0 Z" fill="#D9342B"/><circle cx="-1.3" cy="-4.6" r=".8" fill="#fff"/><circle cx="1.6" cy="-4" r=".7" fill="#fff"/></g>`, { flat: true });

    place(4, 7, 8, 32, (x, y) => U('t-cedar', x, y, R(0.75, 1)), { pack: 0.7 });
    place(4, 7, 7, 8, (x, y) => U('rock', x, y, R(0.8, 1.5)));
    // 城下（桜と灯籠）
    place(5, 9, 11, 30, (x, y) => U('t-sakura', x, y, R(0.9, 1.15)), { pack: 0.75 });

    place(5, 4, 7, 8, (x, y) => U('t-bush', x, y, R(0.8, 1.1)));
    // 地図の折り目と方位
    for (let y = 300; y < H - 100; y += 330) out += `<path d="M0 ${y} H${MAP_W}" stroke="#000" stroke-opacity=".07" stroke-width="1"/><path d="M0 ${y + 1.2} H${MAP_W}" stroke="#fff" stroke-opacity=".3" stroke-width="1"/>`;
    const cpx = st.x < MAP_W / 2 ? MAP_W - 40 : 40, cpy = H - 96;
    out += `<g transform="translate(${cpx} ${cpy})" opacity=".75"><circle r="15" fill="#F6F1E4" stroke="${INK}" stroke-width="1.2"/><path d="M0 -12 L4 0 L0 12 L-4 0 Z" fill="#fff" stroke="${INK}" stroke-width="1"/><path d="M0 -12 L4 0 H-4 Z" fill="#E60012"/><text y="-18" font-size="9" font-weight="900" text-anchor="middle" fill="${INK}">N</text></g>`;

    out += ground;

    out += objs.map(o => o.s).join('');

    // 道（マスを結ぶなめらかな曲線）と、ゴールから城門への石畳
    let d = `M${nodes[0].x} ${nodes[0].y}`;

    }
    out += `<path d="M${gl.x} ${gl.y} C ${gl.x} ${gl.y - 34}, ${ccx} ${cby + 40}, ${ccx} ${cby + 2}" stroke="#77736A" stroke-width="16" fill="none" stroke-linecap="butt"/>
      <path d="M${gl.x} ${gl.y} C ${gl.x} ${gl.y - 34}, ${ccx} ${cby + 40}, ${ccx} ${cby + 2}" stroke="#D5D0C2" stroke-width="12" fill="none" stroke-dasharray="5 1.4"/>`;
    out += `<path d="${d}" stroke="#000" stroke-opacity=".16" stroke-width="27" fill="none" stroke-linecap="round" transform="translate(0 2.5)"/>

    // 朱塗りの橋

    }
    // マス
    board.cells.forEach((c, i) => {
      const n = nodes[i], info = cellInfo(c);
      const big = c.t === 'stop' || c.t === 'start' || c.t === 'goal';
      const r = big ? 18 : 16;

      if (c.t === 'stop') {
        // 関所の門（紅白の遮断棒）
        out += `<g><path d="M${n.x - 27} ${n.y + 8} v-40 M${n.x + 27} ${n.y + 8} v-40" stroke="#4A341F" stroke-width="4.5" stroke-linecap="round"/>
          <rect x="${n.x - 31}" y="${n.y - 34}" width="62" height="8" fill="url(#m-stripe)" stroke="${INK}" stroke-width="1.4"/></g>`;
      }
      const num = i && c.t !== 'goal' ? `<tspan class="no">${i}</tspan> ` : '';
      const lab = c.t === 'start'
        ? `<text x="${n.x}" y="${n.y + 46}" class="lb is-start" text-anchor="middle">スタート</text>`
        : `<text x="${lx}" y="${n.y + 4.5}" class="lb is-${c.t}" text-anchor="${left ? 'start' : 'end'}">${num}${esc(info.label)}</text>`;
      out += `<g class="node" id="nd-${i}">${token(c, n.x, n.y, r)}${lab}</g>`;
    });
    return `<svg class="map" viewBox="0 0 ${MAP_W} ${H}" preserveAspectRatio="xMidYMin meet" aria-label="すごろくの地図">${out}</svg>`;
  }

  // ---------- 問題 ----------
  function modeOf(q) {
    const f = q.formats;
    if (f.includes('choice4') && q.choices && q.choices.length === 4) return 'choice4';
    return f.includes('five') ? 'five' : f.includes('image') ? 'image' : f.includes('flip') ? 'flip' : null;
  }
  function pickQuestion(genre, hard) {
    const g = state.game;
    const ng = new Set(state.setup.ng);
    const target = LEVEL_TARGET[state.setup.level] - (hard ? 0.14 : 0);
    const today = new Date().toISOString().slice(0, 10);
    const used = new Set(g.usedQ);
    const blocked = new Set(g.usedQ.flatMap(id => (QMAP.get(id) || {}).conflicts_with || []));
    const ok = q => !used.has(q.id) && !blocked.has(q.id) && !ng.has(q.genre) && (!q.valid_until || q.valid_until >= today) && modeOf(q);
    let pool = DB.filter(q => ok(q) && (!genre || q.genre === genre));
    if (!pool.length) pool = DB.filter(ok);
    const ease = q => q.expected_correct_rate ?? 0.6;
    pool.sort((a, b) => Math.abs(ease(a) - target) - Math.abs(ease(b) - target));
    const top = pool.slice(0, 10);
    return top[rnd(top.length)] || null;
  }

  // ---------- 駒・カメラ・演出 ----------
  const G = () => state.game;
  const cur = () => G().players[G().turn];
  const cellAt = i => G().board.cells[i];
  let busy = false; // 駒やサイコロのアニメーション中は操作を受け付けない
  // 画面に出ているもの（保存しない）
  const V = { built: null, scale: 1, pcs: [], cam: { y: 0, v: 0, run: false, target: 0, follow: -1, t: 0, w: 6.5 }, move: null, fresh: {} };
  const $ = sel => document.querySelector(sel);

  function fxLayer() {
    let el = document.getElementById('fx');
    if (!el) { el = document.createElement('div'); el.id = 'fx'; document.body.appendChild(el); }
    return el;
  }
  function fxAdd(html, ms) {
    const t = document.createElement('div');
    t.innerHTML = html.trim();
    const el = t.firstChild;
    fxLayer().appendChild(el);
    if (ms) setTimeout(() => el.remove(), ms / (RM ? 1 : Math.min(SPEED, 2)));
    return el;
  }
  function stageRect() {
    const w = $('.mapwrap');
    return w ? w.getBoundingClientRect() : { left: 0, top: 80, width: innerWidth, height: innerHeight * 0.5 };
  }
  // テレビのテロップ風の帯
  function telop(html, cls = '', ms = 1500) {
    const r = stageRect();
    return fxAdd(`<div class="telop ${cls}" style="top:${Math.round(r.top + r.height * 0.3)}px"><div class="telop-in">${html}</div></div>`, ms);
  }
  function confetti(n = 36) {
    if (RM) return;
    const cols = ['#E60012', '#FFE14D', '#141414', '#FFFFFF', '#1F5FD1', '#14915A'];
    let s = '';
    for (let i = 0; i < n; i++) s += `<i style="left:${rnd(100)}%;background:${cols[i % cols.length]};--d:${(Math.random() * 0.7).toFixed(2)}s;--x:${rnd(120) - 60}px;--r:${rnd(900) - 450}deg;--t:${(1.5 + Math.random() * 1.1).toFixed(2)}s;width:${6 + rnd(6)}px;height:${9 + rnd(8)}px"></i>`;
    fxAdd(`<div class="confetti">${s}</div>`, 3600);
  }
  // 正解の赤丸・不正解のバツ
  function stamp(ok) {
    const r = stageRect();
    fxAdd(`<div class="stamp ${ok ? 'is-ok' : 'is-ng'}" style="top:${Math.round(r.top + r.height * 0.42)}px">
      <svg viewBox="0 0 120 120">${ok ? '<circle cx="60" cy="60" r="44" pathLength="100"/>' : '<path d="M24 24 L96 96" pathLength="100"/><path class="s2" d="M96 24 L24 96" pathLength="100"/>'}</svg>
      <b>${ok ? '正解！' : '不正解…'}</b></div>`, 1500);
  }

  function measure() {
    const box = $('.mapbox');
    if (box) V.scale = box.clientWidth / MAP_W;
  }
  // 同じマスにいる駒は横に並べる。手番の人は少し手前
  function restOf(i) {
    const g = G(), p = g.players[i], n = geo(g.board).nodes[p.pos];
    const same = g.players.map((q, j) => j).filter(j => g.players[j].pos === p.pos);
    const k = same.indexOf(i), m = same.length;
    const gap = m > 4 ? 11 : 14;
    return { x: n.x + (k - (m - 1) / 2) * gap, y: n.y + (i === g.turn && m > 1 ? 4 : 0) - (m > 1 && k % 2 ? 3 : 0) };
  }
  function applyPiece(i) {
    const pc = V.pcs[i];
    if (!pc || !pc.el) return;
    const s = V.scale;
    pc.el.style.transform = `translate3d(${f1(pc.x * s)}px,${f1(pc.y * s)}px,0)`;
    pc.lift.style.transform = `translate3d(0,${f1(-pc.jump * s)}px,0) rotate(${f1(pc.rot)}deg)`;
    pc.body.style.transform = `scale(${pc.sx.toFixed(3)},${pc.sy.toFixed(3)})`;
    const k = clamp(1 - pc.jump / 70, 0.45, 1);
    pc.shadow.style.transform = `scale(${k.toFixed(2)})`;
    pc.shadow.style.opacity = (0.32 * k).toFixed(2);
    pc.el.style.zIndex = String(10 + Math.round(pc.y / 4) + (pc.jump > 0 ? 400 : 0));
  }
  function initPieces() {
    const g = G();
    V.pcs = g.players.map((p, i) => {
      const el = document.getElementById(`pc-${i}`);
      return { el, lift: el.querySelector('.pc-lift'), body: el.querySelector('.pc-body'), shadow: el.querySelector('.pc-shadow'), tag: el.querySelector('.pc-tag'), x: 0, y: 0, jump: 0, rot: 0, sx: 1, sy: 1 };
    });
  }
  // 動いていない駒を定位置へ（smooth なら CSS でするっと寄る）
  function layoutPieces(smooth, except = -1) {
    const g = G();
    if (!g) return;
    g.players.forEach((p, i) => {
      const pc = V.pcs[i];
      if (!pc || !pc.el) return;
      pc.el.classList.toggle('is-turn', i === g.turn);
      if (i === except) return;
      const r = restOf(i);
      pc.x = r.x; pc.y = r.y; pc.jump = 0; pc.rot = 0; pc.sx = 1; pc.sy = 1;
      pc.el.classList.toggle('is-slide', !!smooth && !RM);
      applyPiece(i);
    });
  }

  // カメラ: ばね（臨界減衰）で目標に寄せる。急に飛ばず、止まるときもなめらか
  function camTick(now) {
    const c = V.cam, wrap = $('.mapwrap');
    if (!wrap) { c.run = false; return; }
    const dt = Math.min(0.034, (now - c.t) / 1000) * Math.min(SPEED, 3); c.t = now;
    if (c.follow >= 0 && V.pcs[c.follow]) c.target = V.pcs[c.follow].y;
    const max = wrap.scrollHeight - wrap.clientHeight;
    const tgt = clamp(c.target * V.scale - wrap.clientHeight * 0.6, 0, Math.max(0, max));
    const w = c.w;
    c.v += (w * w * (tgt - c.y) - 2 * w * c.v) * dt;
    c.y += c.v * dt;
    wrap.scrollTop = c.y;
    if (c.follow < 0 && Math.abs(tgt - c.y) < 0.5 && Math.abs(c.v) < 4) { c.run = false; wrap.scrollTop = tgt; return; }
    requestAnimationFrame(camTick);
  }
  function camStart() {
    const c = V.cam, wrap = $('.mapwrap');
    if (!wrap) return;
    if (!c.run) { c.y = wrap.scrollTop; c.v = 0; c.t = performance.now(); c.run = true; requestAnimationFrame(camTick); }
  }
  function camTo(pos, snap) {
    const g = G(), wrap = $('.mapwrap');
    if (!g || !wrap) return;
    const c = V.cam;
    c.follow = -1; c.target = geo(g.board).nodes[pos].y;
    if (snap || RM) {
      c.run = false;
      wrap.scrollTop = clamp(c.target * V.scale - wrap.clientHeight * 0.6, 0, Math.max(0, wrap.scrollHeight - wrap.clientHeight));
      return;
    }
    c.w = 5; camStart();
  }
  function camFollow(pi) { V.cam.follow = pi; V.cam.w = 6.5; if (!RM) camStart(); }
  function camRelease() { const c = V.cam; if (c.follow >= 0 && V.pcs[c.follow]) c.target = V.pcs[c.follow].y; c.follow = -1; if (RM) camTo(G().players[0] ? cur().pos : 0, true); }

  // 着地の土ぼこりと、止まったマスの波紋
  function dust(x, y, big) {
    if (RM) return;
    const lay = $('.pieces');
    if (!lay) return;
    const el = document.createElement('i');
    el.className = `dust${big ? ' is-big' : ''}`;
    el.style.transform = `translate3d(${f1(x * V.scale)}px,${f1(y * V.scale)}px,0)`;
    lay.appendChild(el);
    setTimeout(() => el.remove(), 700);
  }
  function setTag(pi, text) {
    const pc = V.pcs[pi];
    if (!pc || !pc.tag) return;
    pc.tag.textContent = text || '';
    pc.tag.hidden = !text;
  }

  // 1マスぶんのジャンプ: しゃがむ → 道に沿って放物線で跳ぶ → 着地で潰れて戻る
  async function hop(pi, from, to, o) {
    const g = G(), { nodes } = geo(g.board), pc = V.pcs[pi];
    const end = restOf(pi);
    if (!pc || !pc.el) return;
    if (RM) {
      pc.x = end.x; pc.y = end.y; pc.el.classList.add('is-slide'); applyPiece(pi);
      layoutPieces(true, pi); camTo(to, true);
      await sleep(220);
      return;
    }
    const a = nodes[from], b = nodes[to];
    const offA = { x: pc.x - a.x, y: pc.y - a.y }, offB = { x: end.x - b.x, y: end.y - b.y };
    const seg = Math.min(from, to), fwd = to > from;
    const dirX = Math.sign(b.x - a.x) || (fwd ? 1 : -1);
    const A = o.first ? 0.2 : 0.14, L = 0.78;
    let landedFx = false;
    pc.el.classList.remove('is-slide'); pc.el.classList.add('is-hop');
    layoutPieces(true, pi);
    await animate(o.dur, t => {
      let u = 0;
      if (t < A) { // ため
        const s = Math.sin((t / A) * Math.PI / 2);
        pc.sy = 1 - 0.2 * s; pc.sx = 1 + 0.15 * s; pc.jump = 0; pc.rot = 0;
      } else if (t < L) { // 空中
        const k = (t - A) / (L - A);
        u = k < 0.5 ? 2 * k * k * 0.5 + k * 0.5 : 1 - ((1 - k) * (1 - k) * 0.5 + (1 - k) * 0.5); // ほぼ等速、端だけ少し丸める
        pc.jump = o.h * 4 * k * (1 - k);
        const st = 0.17 * Math.abs(Math.cos(k * Math.PI));
        pc.sy = 1 + st; pc.sx = 1 - st * 0.6;
        pc.rot = dirX * 8 * Math.sin(k * Math.PI) * (fwd ? 1 : 0.6);
      } else { // 着地
        const k = (t - L) / (1 - L);
        u = 1;
        if (!landedFx) { landedFx = true; o.onLand && o.onLand(); }
        const s = Math.exp(-4.2 * k) * Math.cos(k * 7.2) * (o.last ? 1.25 : 1);
        pc.sy = 1 - 0.25 * s; pc.sx = 1 + 0.2 * s; pc.jump = 0; pc.rot = 0;
      }
      const p = roadPt(nodes, seg, fwd ? u : 1 - u);
      pc.x = p.x + lerp(offA.x, offB.x, u); pc.y = p.y + lerp(offA.y, offB.y, u);
      applyPiece(pi);
    });
    pc.sx = pc.sy = 1; pc.x = end.x; pc.y = end.y; applyPiece(pi);
    pc.el.classList.remove('is-hop');
  }
  // その場で小さく跳ねる（喜ぶ・ぶつかる）
  async function bounce(pi, h, dur, nudge = 0) {
    const pc = V.pcs[pi];
    if (!pc || !pc.el || RM) return;
    const x0 = pc.x;
    pc.el.classList.remove('is-slide'); pc.el.classList.add('is-hop');
    await animate(dur, t => {
      if (t < 0.7) { const k = t / 0.7; pc.jump = h * 4 * k * (1 - k); pc.sy = 1 + 0.12 * Math.abs(Math.cos(k * Math.PI)); pc.sx = 2 - pc.sy; pc.x = x0 + nudge * Math.sin(k * Math.PI); }
      else { const k = (t - 0.7) / 0.3, s = Math.exp(-4 * k) * Math.cos(k * 7); pc.jump = 0; pc.sy = 1 - 0.2 * s; pc.sx = 1 + 0.16 * s; pc.x = x0; }
      applyPiece(pi);
    });
    pc.sx = pc.sy = 1; pc.jump = 0; applyPiece(pi);
    pc.el.classList.remove('is-hop');
  }

  // 駒を1マスずつ動かす。forward で途中にストップマスがあればそこで止まる
  async function walk(pi, steps, opts = {}) {
    const g = G(), p = g.players[pi];
    const dir = steps >= 0 ? 1 : -1;
    const total = Math.abs(steps);
    let left = total, stopped = false, first = true;
    if (!total) return false;
    const back = dir < 0;
    camFollow(pi);
    V.pcs[pi] && V.pcs[pi].el && V.pcs[pi].el.classList.add('is-moving');
    if (!first) await sleep(60);
    while (left > 0) {
      const from = p.pos, nx = p.pos + dir;
      if (nx < 0 || nx > g.board.len) break;
      p.pos = nx; left--;
      const willStop = dir > 0 && !opts.ignoreStop && cellAt(nx).t === 'stop' && left > 0;
      const last = left === 0 || nx >= g.board.len || willStop || nx === 0;
      setTag(pi, opts.count ? String(left + 1) : '');
      const pc = V.pcs[pi];
      await hop(pi, from, nx, {
        dur: back ? 400 : last ? 580 : 520, h: back ? 15 : last ? 30 : 25, first, last,
        onLand() {
          sfx(last ? 'land' : back ? 'back' : 'hop'); buzz(last ? 18 : 6);
          if (pc) dust(pc.x, pc.y, last);
          updateSteps(total - left, total);
        },
      });
      first = false;
      if (p.pos >= g.board.len) break;
      if (willStop) { stopped = true; break; }
    }
    setTag(pi, '');
    V.pcs[pi] && V.pcs[pi].el && V.pcs[pi].el.classList.remove('is-moving');
    if (stopped) { // ストップマスにぶつかる
      telop(`<small>STOP</small><b>${esc(cellAt(p.pos).name)}</b><span>で足止め</span>`, 'is-stop', 1500);
      sfx('gate'); buzz([40, 50, 40]);
      await bounce(pi, 5, 320, 0);
      await sleep(420);
    }
    if (p.pos >= g.board.len && g.winner === null) {
      g.winner = pi;
      telop(`<small>GOAL</small><b>${esc(p.name)}</b><span>がゴール！</span>`, 'is-goal', 2200);
      sound('fanfare'); confetti(44);
      for (let i = 0; i < 3; i++) await bounce(pi, 20, 380);
    }
    camRelease();
    layoutPieces(true);
    await sleep(RM ? 0 : 160);
    return stopped;
  }
  function updateSteps(done, total) {
    const el = document.getElementById('steps');
    if (!el) return;
    el.querySelectorAll('i').forEach((d, i) => d.classList.toggle('is-done', i < done));
    const n = document.getElementById('steps-left');
    if (n) n.textContent = String(Math.max(0, total - done));
  }

  // サイコロ: 手元で振る → 盤の上に放る → 2回弾む → 角で一瞬ためて → コトンと出目が決まる
  async function rollDice(val) {
    const r = stageRect();
    const src = $('.die-btn .die');
    const S = 88;
    const tx = r.left + r.width / 2, ty = r.top + r.height * 0.44;
    let sx = tx, sy = innerHeight - 150;
    if (src) { const b = src.getBoundingClientRect(); sx = b.left + b.width / 2; sy = b.top + b.height / 2; src.style.visibility = 'hidden'; }
    const el = fxAdd(`<div class="dstage"><i class="ds-shadow"></i><div class="ds-die">${dieHTML()}</div>
      <div class="ds-call" style="left:${Math.round(tx)}px;top:${Math.round(ty + S * 0.86)}px"><b>${val}</b><span>マス すすむ</span></div></div>`);
    const die = el.querySelector('.ds-die'), cube = el.querySelector('.cube'), sh = el.querySelector('.ds-shadow');
    const [ax, ay] = SHOW[val];
    const put = (x, y, lift, sc, rx, ry, rz, sqx = 1, sqy = 1) => {
      die.style.transform = `translate3d(${f1(x - S / 2)}px,${f1(y - lift - S / 2)}px,0) scale(${(sc * sqx).toFixed(3)},${(sc * sqy).toFixed(3)})`;
      cube.style.transform = `rotateX(-24deg) rotateY(-28deg) rotateZ(${f1(rz)}deg) rotateX(${f1(ax + rx)}deg) rotateY(${f1(ay + ry)}deg)`;
      const k = clamp(1 - lift / 260, 0.35, 1);
      sh.style.transform = `translate3d(${f1(x - S / 2)}px,${f1(y + S * 0.42)}px,0) scale(${(sc * k).toFixed(2)})`;
      sh.style.opacity = (0.3 * k).toFixed(2);
    };
    if (RM) {
      put(tx, ty, 0, 1, 0, 0, 0);
      sfx('set'); el.classList.add('is-set');
      await sleep(1100);
      el.remove();
      return;
    }
    sound('dice'); buzz(20);
    const TE = 40; // 角で止まるときの傾き
    const T = { shake: 300, fly: 620, b1: 280, b2: 190, tame: 380, drop: 130 };
    const spinTotal = T.fly + T.b1 + T.b2;
    const turnsX = 360 * 3, turnsY = 360 * 2 + 90, turnsZ = 200;
    const rot = ms => { const k = clamp(ms / spinTotal, 0, 1), e = 1 - (1 - k) * (1 - k); return [TE + turnsX * (1 - e), turnsY * (1 - e), turnsZ * (1 - e)]; };
    const s0 = 0.66;
    // 手元でカラカラ
    await animate(T.shake, t => {
      const j = Math.sin(t * Math.PI * 7);
      put(sx + j * 5, sy + Math.cos(t * 40) * 2, 0, s0 + 0.05 * Math.sin(t * Math.PI), TE + turnsX + j * 26, turnsY + j * 30, turnsZ + j * 14);
    });
    // 放る
    await animate(T.fly, t => {
      const x = lerp(sx, tx, t), yb = lerp(sy, ty, t), lift = 150 * 4 * t * (1 - t) * (0.6 + 0.4 * t);
      const [rx, ryy, rz] = rot(t * T.fly);
      put(x, yb, lift, lerp(s0, 1, t), rx, ryy, rz);
    });
    sfx('die'); buzz(10);
    await animate(T.b1, t => {
      const [rx, ryy, rz] = rot(T.fly + t * T.b1);
      const sq = t < 0.15 ? 1 - 0.1 * (1 - t / 0.15) : 1;
      put(tx, ty, 46 * 4 * t * (1 - t), 1, rx, ryy, rz, 2 - sq, sq);
    });
    sfx('die'); buzz(8);
    await animate(T.b2, t => {
      const [rx, ryy, rz] = rot(T.fly + T.b1 + t * T.b2);
      put(tx, ty, 16 * 4 * t * (1 - t), 1, rx, ryy, rz);
    });
    sfx('hop');
    // タメ: 角で立ってゆらゆら
    el.classList.add('is-tame');
    await animate(T.tame, t => {
      const wob = TE + 7 * Math.sin(t * Math.PI * 2.5) * (1 - t * 0.5);
      put(tx, ty, 9 * Math.sin(Math.min(1, wob / 45) * Math.PI / 2), 1, wob, 0, 2.5 * Math.sin(t * Math.PI * 3));
    });
    // コトン
    await animate(T.drop, t => { const e = t * t; put(tx, ty, 9 * (1 - e), 1, TE * (1 - e), 0, 0); });
    sfx('set'); buzz(26);
    el.classList.remove('is-tame'); el.classList.add('is-set');
    animate(260, t => { const s = Math.exp(-4 * t) * Math.cos(t * 8); put(tx, ty, 0, 1, 0, 0, 0, 1 + 0.12 * s, 1 - 0.14 * s); });
    await sleep(120);
    sfx('pop');
    await sleep(760);
    el.classList.add('is-out');
    await sleep(200);
    el.remove();
  }

  // ---------- ゲーム進行 ----------
  function startGame() {
    const s = state.setup;
    const names = s.players.map(n => n.trim()).filter(Boolean);
    if (names.length < 2) { toast('2人以上の名前を入れてください'); return; }
    state.game = {
      board: makeBoard(s.len, s.drinks, s.ng),
      players: names.map((name, i) => ({ name, color: COLORS[i], pos: 0, skip: false })),
      turn: 0, phase: 'turn', from: 0, q: null, picked: null, ok: null, allOk: [], dice: null,
      challenge: false, msg: '', res: null, after: null, usedQ: [], hist: [], winner: null, asked: 0,
    };
    state.screen = 'game';
    V.built = null;
    Sound.unlock(); Sfx.unlock(); sound('round');
    commit();
    openingPan();
  }
  // はじまり: お城（ゴール）を見せてから、スタートまで地図を下っていく
  async function openingPan() {
    const g = G();
    if (RM || !$('.mapwrap')) { callTurn(); return; }
    busy = true;
    const wrap = $('.mapwrap');
    const end = wrap.scrollTop;
    wrap.scrollTop = 0; V.cam.run = false;
    await sleep(900);
    await animate(Math.min(3000, 1500 + g.board.len * 50), t => { const e = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; wrap.scrollTop = end * e; });
    busy = false;
    callTurn();
  }
  function callTurn() {
    const g = G();
    if (!g || state.screen !== 'game') return;
    telop(`<small>NEXT</small><b style="--pc:${cur().color}">${esc(cur().name)}</b><span>の番</span>`, 'is-turn', 1400);
  }

  function snapshot() {
    const g = G();
    g.hist.push(JSON.stringify({ players: g.players, turn: g.turn, winner: g.winner }));
    if (g.hist.length > 30) g.hist.shift();
  }

  async function roll() {
    const g = G();
    if (busy || g.phase !== 'turn') return;
    busy = true;
    const val = 1 + rnd(6);
    camTo(cur().pos);
    g.dice = val; g.phase = 'rolling';
    // サイコロは手元の絵から飛び出すので、足元の表示はまだ書き換えない
    const btn = $('.act .big'); if (btn) { btn.disabled = true; btn.textContent = 'コロコロ…'; }
    await rollDice(val);
    snapshot();
    g.from = cur().pos;
    g.phase = 'moving'; g.res = null; save();
    V.move = { label: `${val}マス進む`, total: val, dice: val };
    render();
    const stopped = await walk(g.turn, val, { count: true });
    V.move = null;
    busy = false;
    landed(stopped);
  }

  function landed(stopped) {
    const g = G(), p = cur(), c = cellAt(p.pos);
    g.challenge = false;
    if (g.winner !== null) { g.msg = `${g.players[g.winner].name} がゴール！`; g.res = 'goal'; g.after = 'end'; g.phase = 'moved'; commit(); return; }
    g.phase = 'landed';
    if (c.t === 'stop') g.msg = `${stopped ? 'ストップ！ ' : ''}${c.name}。少し難しい問題に正解すると2マス進める`;
    else if (c.t === 'genre') g.msg = `「${GENRES[c.g][0]}」の問題。正解ならここに残れる。不正解なら${g.from}マス目に戻る`;
    else if (c.t === 'challenge') g.msg = 'チャレンジマス。難しい問題に挑んで正解すると、さらに3マス進む';
    else if (c.t === 'all') g.msg = '全員クイズ！ 早い者勝ち。正解した人は2マス進む';
    else if (c.t === 'event') g.msg = EVENTS[c.e].text;
    else if (c.t === 'drink') g.msg = DRINKS[c.d].text;
    else g.msg = '';
    if (!stopped) sound('reveal');
    commit();
  }

  // 止まったマスの処理（「問題に挑戦」「効果を受ける」などのボタンから）
  async function resolveCell() {
    const g = G(), c = cellAt(cur().pos);
    if (busy || g.phase !== 'landed') return;
    if (c.t === 'genre') return askQuestion({ genre: c.g });
    if (c.t === 'challenge') return askQuestion({ hard: true, kind: 'challenge' });
    if (c.t === 'stop') return askQuestion({ hard: true, kind: 'stop' });
    if (c.t === 'all') return askQuestion({ all: true });
    if (c.t === 'event') return applyEvent(c.e);
    if (c.t === 'drink') return; // 飲んだ／パスのボタンで処理
    finishTurn('');
  }

  function askQuestion({ genre, hard, all, kind }) {
    const g = G();
    const gs = g.board.genres;
    const q = pickQuestion(genre || gs[rnd(gs.length)], !!hard);
    if (!q) { toast('出せる問題がなくなりました'); finishTurn(''); return; }
    g.usedQ.push(q.id); g.asked++;
    g.q = { id: q.id, mode: modeOf(q), hard: !!hard, all: !!all, kind: kind || (all ? 'all' : 'genre') };
    g.picked = null; g.ok = null; g.allOk = [];
    g.phase = 'question';
    sound('question');
    commit();
  }
  function judge(ok) {
    const g = G();
    g.ok = ok; g.phase = 'reveal';
    sound(ok ? 'correct' : 'wrong'); buzz(ok ? 30 : [60, 40, 60]);
    commit();
    stamp(ok);
    if (ok) confetti(22);
  }
  // 4択: 選んだ札が沈む → ひと呼吸（タメ）→ 正解オープン
  async function choose(i) {
    const g = G(), q = QMAP.get(g.q.id);
    if (busy || g.phase !== 'question') return;
    busy = true;
    g.picked = i;
    const btns = document.querySelectorAll('.choice');
    btns.forEach((b, j) => { b.disabled = true; b.classList.toggle('is-picked', j === i); b.classList.toggle('is-wait', j !== i); });
    sfx('set'); buzz(12);
    await sleep(RM ? 200 : 750);
    busy = false;
    if (g.q.all) { g.phase = 'reveal'; sound('reveal'); commit(); return; }
    judge(q.choices[i] === q.answer);
  }

  async function closeSheet() {
    const sh = $('.qcard');
    if (sh && !RM) { sh.classList.add('is-out'); const bk = $('.sheet-back'); if (bk) bk.classList.add('is-out'); await sleep(200); }
  }

  async function afterReveal() {
    const g = G();
    if (busy || g.phase !== 'reveal') return;
    busy = true;
    const kind = g.q.kind, ok = g.ok, allOk = g.allOk.slice();
    await closeSheet();
    g.q = null; g.phase = 'moving';
    let msg = '', res = null;
    const mv = (label, total) => { V.move = { label, total }; render(); };
    if (kind === 'all') {
      mv(allOk.length ? '正解者が2マス進む' : '', 0);
      for (const i of allOk) { camTo(g.players[i].pos); await sleep(RM ? 0 : 350); await walk(i, 2, { ignoreStop: true }); }
      msg = allOk.length ? `${allOk.map(i => g.players[i].name).join('・')} が2マス進んだ` : '正解者なし';
      res = 'event';
    } else if (kind === 'genre') {
      res = ok ? 'ok' : 'ng';
      if (ok) { mv('', 0); await bounce(g.turn, 16, 360); msg = `正解！ ${cur().pos}マス目に残る`; }
      else { mv(`${g.from}マス目に戻る`, cur().pos - g.from); await sleep(RM ? 0 : 250); await walk(g.turn, g.from - cur().pos); msg = `不正解… ${g.from}マス目に戻る`; }
    } else if (kind === 'challenge') {
      res = ok ? 'ok' : 'ng';
      if (ok) { mv('チャレンジ成功！ 3マス進む', 3); await sleep(RM ? 0 : 250); await walk(g.turn, 3, { count: true }); msg = 'チャレンジ成功！ 3マス進んだ'; }
      else { mv(`${g.from}マス目に戻る`, cur().pos - g.from); await sleep(RM ? 0 : 250); await walk(g.turn, g.from - cur().pos); msg = `チャレンジ失敗… ${g.from}マス目に戻る`; }
    } else if (kind === 'stop') {
      res = ok ? 'ok' : 'ng';
      if (ok) { mv('突破！ 2マス進む', 2); await sleep(RM ? 0 : 250); await walk(g.turn, 2, { ignoreStop: true, count: true }); msg = '突破！ 2マス進んだ'; }
      else { mv('', 0); msg = '残念。ここで足止め'; }
    }
    V.move = null;
    busy = false;
    finishTurn(msg, res);
  }

  async function applyEvent(e) {
    const g = G(), t = g.turn, all = g.players.map((_, i) => i);
    if (e === 'again') { g.phase = 'turn'; g.msg = 'もう一度サイコロ！'; sfx('pop'); commit(); return; }
    busy = true; g.phase = 'moving';
    V.move = { label: EVENTS[e].text, total: 0 }; render();
    let msg = EVENTS[e].text;
    if (e === 'fwd2') await walk(t, 2);
    else if (e === 'back3') await walk(t, -3);
    else if (e === 'skip') g.players[t].skip = true;
    else if (e === 'lastfwd') { const i = all.reduce((a, b) => (g.players[b].pos < g.players[a].pos ? b : a)); camTo(g.players[i].pos); await sleep(RM ? 0 : 450); await walk(i, 2, { ignoreStop: true }); msg += `（${g.players[i].name}）`; }
    else if (e === 'topback') {
      const rest = all.filter(i => i !== t);
      const i = rest.reduce((a, b) => (g.players[b].pos > g.players[a].pos ? b : a));
      camTo(g.players[i].pos); await sleep(RM ? 0 : 450);
      await walk(i, -2); msg += `（${g.players[i].name}）`;
    }
    V.move = null;
    busy = false;
    finishTurn(msg, 'event');
  }

  async function drink(done) {
    const g = G(), c = cellAt(cur().pos);
    if (busy || g.phase !== 'landed') return;
    let msg = `${cur().name} はパス`;
    if (done) {
      busy = true; g.phase = 'moving';
      V.move = { label: `乾杯！ ${DRINKS[c.d].bonus}マス進む`, total: DRINKS[c.d].bonus }; render();
      sound('fanfare'); confetti(18);
      telop(`<small>KANPAI</small><b>${DRINKS[c.d].icon} 乾杯！</b>`, 'is-drink', 1300);
      await sleep(RM ? 0 : 700);
      await walk(g.turn, DRINKS[c.d].bonus, { ignoreStop: true, count: true });
      V.move = null;
      busy = false;
      msg = `飲んだ！ ${DRINKS[c.d].bonus}マス進んだ`;
    }
    finishTurn(msg, done ? 'ok' : 'event');
  }

  function finishTurn(msg, res = null) {
    const g = G();
    g.phase = 'moved';
    g.after = g.winner !== null ? 'end' : 'next';
    g.msg = g.winner !== null ? `${g.players[g.winner].name} がゴール！` : msg;
    g.res = g.winner !== null ? 'goal' : res;
    commit();
  }

  function nextTurnIndex() {
    const g = G(), n = g.players.length;
    let t = g.turn;
    for (let i = 0; i < n; i++) { t = (t + 1) % n; if (!g.players[t].skip) return t; }
    return (g.turn + 1) % n;
  }
  function proceed() {
    const g = G();
    if (busy) return;
    if (g.after === 'end') { state.screen = 'result'; sound('drum'); commit(); setTimeout(() => { sound('fanfare'); confetti(60); }, RM ? 0 : 1500); return; }
    // 次の人へ（1回休みは飛ばす）
    const n = g.players.length, skipped = [];
    let t = g.turn;
    for (let i = 0; i < n; i++) {
      t = (t + 1) % n;
      if (g.players[t].skip) { g.players[t].skip = false; skipped.push(g.players[t].name); continue; }
      break;
    }
    g.turn = t; g.phase = 'turn'; g.dice = null; g.after = null; g.res = null;
    g.msg = skipped.length ? `${skipped.join('・')} は1回休み` : '';
    commit();
    layoutPieces(true);
    camTo(cur().pos);
    sfx('pop');
    callTurn();
  }

  function undo() {
    const g = G();
    if (busy) return;
    if (!g || !g.hist.length) { toast('戻せる手がありません'); return; }
    Object.assign(g, JSON.parse(g.hist.pop()));
    g.phase = 'turn'; g.q = null; g.dice = null; g.after = null; g.res = null; g.msg = '1手戻しました';
    closeMenu(); commit();
    layoutPieces(true);
    camTo(cur().pos);
  }

  // ---------- トースト・メニュー ----------
  let toastTimer;
  function toast(msg) {
    let el = document.getElementById('toast');
    if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = msg; el.classList.add('is-on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('is-on'), 2200);
  }
  let menuOpen = false;
  function closeMenu() { menuOpen = false; }

  // ---------- 描画 ----------
  const miniPawn = (color, ch = '') => `<span class="mini-pawn">${pawnSVG(color, ch)}</span>`;

  function standings() {
    const g = G(), len = g.board.len;
    const top = Math.max(...g.players.map(p => p.pos));
    return `<div class="stand" style="--n:${g.players.length}">${g.players.map((p, i) => `<div class="pl${i === g.turn ? ' is-turn' : ''}${g.players.length > 4 ? ' is-narrow' : ''}" style="--pc:${p.color}">
        <span class="nm">${esc(p.name)}</span>
        <span class="ps">${p.pos >= len ? '<em>GOAL</em>' : `${p.pos}<small>/${len}</small>`}</span>
        ${p.skip ? '<span class="rest">1回休み</span>' : p.pos === top && top > 0 && g.players.filter(q => q.pos === top).length === 1 ? '<span class="lead">トップ</span>' : ''}
      </div>`).join('')}</div>
      <div class="race" aria-hidden="true"><i class="race-goal"></i>${g.players.map((p, i) => `<i class="race-dot${i === g.turn ? ' is-turn' : ''}" style="--pc:${p.color};--at:${Math.min(1, p.pos / len)}"></i>`).join('')}</div>`;
  }

  function questionHTML() {
    const g = G(), q = QMAP.get(g.q.id);
    const reveal = g.phase === 'reveal';
    const p = cur(), c = cellAt(p.pos);
    const kind = g.q.kind;
    const stake = {
      all: '早い者勝ち ・ 正解した人は 2マス進む',
      challenge: `正解で さらに3マス ・ 不正解は ${g.from}マス目へ`,
      stop: '正解で 2マス進む ・ 不正解は 足止め',
      genre: `正解で ここに残る ・ 不正解は ${g.from}マス目へ`,
    }[kind];
    const title = { all: '全員クイズ', challenge: 'チャレンジ', stop: c.name || 'ストップ', genre: '' }[kind];
    const gname = (GENRES[q.genre] || [''])[0], gcol = (GENRES[q.genre] || [])[2] || INK;
    const image = q.image_svg ? `<div class="q-img">${q.image_svg}</div>` : q.image_emoji ? `<div class="q-img is-emoji">${esc(q.image_emoji)}</div>` : '';
    let body = '';
    if (g.q.mode === 'choice4') {
      body = `<div class="choices">${q.choices.map((ch, i) => {
        const cls = reveal ? (ch === q.answer ? ' is-answer' : i === g.picked ? ' is-wrong' : ' is-dim') : '';
        return `<button class="choice${cls}" data-act="choose" data-i="${i}" ${reveal ? 'disabled' : ''}><b>${'ABCD'[i]}</b><span>${esc(ch)}</span>${reveal && ch === q.answer ? '<i class="mk">○</i>' : reveal && i === g.picked ? '<i class="mk">×</i>' : ''}</button>`;
      }).join('')}</div>`;
    } else if (g.q.mode === 'five' && q.five) {
      body = `<div class="five">${Array.from(q.five).map((ch, i) => `<span style="--i:${i}">${reveal ? esc(ch) : ''}</span>`).join('')}</div>`;
    }
    const verdict = g.q.all || g.ok === null ? '' : g.ok ? ' is-ok' : ' is-ng';
    const answer = reveal ? `<div class="answer${verdict}" id="answer">
        <div class="ans-head">${g.q.all || g.ok === null ? '正解は' : g.ok ? '正解！' : '残念… 正解は'}</div>
        <div class="ans"><span>${esc(q.answer)}</span></div>
        ${q.accept_rule && g.q.mode !== 'choice4' ? `<p class="rule">${esc(q.accept_rule)}</p>` : ''}
        ${q.explanation ? `<p class="expl">${esc(q.explanation)}</p>` : ''}
      </div>` : '';
    return `<div class="sheet-back"></div><section class="qcard is-${kind}">
      <div class="q-head">
        <span class="q-no"><small>Q</small>${g.asked}</span>
        <div class="q-who">${g.q.all ? `<b>全員クイズ</b>` : `${miniPawn(p.color)}<b>${esc(p.name)}</b>`}${title && !g.q.all ? `<em>${esc(title)}</em>` : ''}</div>
        <span class="q-genre" style="--gc:${gcol}">${esc(gname)}</span>
      </div>
      <p class="q-stake">${stake}</p>
      <div class="q-body">
        ${image}
        ${q.display ? `<p class="q-lead">${nl(q.question)}</p><div class="q-text is-display">${nl(q.display)}</div>` : `<div class="q-text">${nl(q.question)}</div>`}
        ${body}
        ${answer}
      </div>
    </section>`;
  }

  function actionHTML() {
    const g = G(), p = cur(), c = cellAt(p.pos);
    const big = (act, label, cls = '', extra = '') => `<button class="big ${cls}" data-act="${act}" ${extra}>${label}</button>`;
    const who = (tail = 'の番') => `<div class="who" style="--pc:${p.color}">${miniPawn(p.color, p.name.slice(0, 1))}<div class="who-t"><b>${esc(p.name)}</b><small>${tail}</small></div></div>`;
    switch (g.phase) {
      case 'turn':
      case 'rolling': {
        const rest = g.board.len - p.pos;
        return `<div class="turn-row">
            <div>${who()}<p class="sub is-left">${g.msg ? `<mark>${esc(g.msg)}</mark>` : `いま ${p.pos}マス目 ・ ゴールまで あと${rest}`}</p></div>
            <button class="die-btn" data-act="roll" aria-label="サイコロを振る">${dieHTML('is-idle')}</button>
          </div>
          ${big('roll', 'サイコロを振る', 'is-red')}`;
      }
      case 'moving': {
        const m = V.move || { label: '移動中', total: 0 };
        return `<div class="turn-row">
            <div>${who('')}<p class="sub is-left">${esc(m.label || '')}</p></div>
            ${m.dice ? `<div class="left-box">${flatDie(m.dice)}<span>あと<b id="steps-left">${m.total}</b></span></div>` : ''}
          </div>
          <div class="steps" id="steps">${Array.from({ length: m.total || 0 }, () => '<i></i>').join('')}</div>`;
      }
      case 'landed': {
        const info = cellInfo(c);
        const btn = c.t === 'drink'
          ? `<div class="judge">${big('drink', 'パス', 'is-white', 'data-v="0"')}${big('drink', '飲んだ！', 'is-amber', 'data-v="1"')}</div>`
          : c.t === 'event' ? big('resolve', 'OK')
          : c.t === 'all' ? big('resolve', '全員クイズを出す', 'is-yellow')
          : c.t === 'goal' ? big('next', '結果発表')
          : big('resolve', '問題に挑戦');
        return `<div class="landed is-${c.t}">${tokenIcon(c)}
            <div class="landed-t"><small>${g.dice ? `${p.pos}マス目 ・ ` : ''}${esc(info.kind)}</small><b>${esc(info.label)}</b></div>
            ${miniPawn(p.color, p.name.slice(0, 1))}
          </div>
          <p class="msg">${esc(g.msg)}</p>${btn}`;
      }
      case 'question':
        if (g.q.mode === 'choice4') return `<p class="hint">${g.q.all ? 'わかった人が答えをタップ' : `${esc(p.name)} が答えをタップ`}</p>`;
        return `<p class="hint">${g.q.all ? 'わかった人は手を挙げて答えて！' : '声に出して答えてから'}</p>${big('show', '答えを見る')}`;
      case 'reveal':
        if (g.q.all) {
          return `<p class="hint">正解した人をタップ（何人でも）</p>
            <div class="pick">${g.players.map((pl, i) => `<button class="pchip${g.allOk.includes(i) ? ' is-on' : ''}" style="--pc:${pl.color}" data-act="allOk" data-i="${i}">${miniPawn(pl.color)}${esc(pl.name)}</button>`).join('')}</div>
            ${big('afterReveal', g.allOk.length ? `決定（${g.allOk.length}人が正解）` : '正解者なしで進む')}`;
        }
        if (g.ok !== null) return big('afterReveal', g.ok ? 'やった！ 次へ' : '次へ');
        return `<p class="hint">みんなで判定</p><div class="judge">${big('judge', '<i>×</i>まちがえた', 'is-white', 'data-v="0"')}${big('judge', '<i>○</i>正解した！', 'is-red', 'data-v="1"')}</div>`;
      case 'moved': {
        const mark = { ok: '○', ng: '×', goal: '🏁', event: '' }[g.res] || '';
        const nx = g.players[nextTurnIndex()];
        return `<div class="res is-${g.res || 'none'}" style="--pc:${p.color}">${mark ? `<span class="res-mark">${mark}</span>` : miniPawn(p.color, p.name.slice(0, 1))}
            <div class="res-t">${g.res === 'ok' || g.res === 'ng' ? `<small>${esc(p.name)}</small>` : ''}<b>${esc(g.msg)}</b></div></div>
          ${g.after === 'end' ? big('next', '結果発表へ', 'is-red') : big('next', `次は <span class="nx" style="--pc:${nx.color}">${esc(nx.name)}</span> の番`)}`;
      }
    }
    return '';
  }

  const barHTML = g => `<span class="title">すごろくクイズ</span><span class="count">${g.asked ? `<b>Q${g.asked}</b>` : ''}ゴールは ${g.board.len}マス目</span>
    <button class="icon" data-act="menu" aria-label="メニュー"><i></i><i></i><i></i></button>`;
  const menuHTML = g => (menuOpen ? `<div class="menu-back" data-act="menu"></div><div class="menu" role="menu">
      <button data-act="undo" ${g.hist.length ? '' : 'disabled'}>1手戻す</button>
      <button data-act="sound">${state.setup.sound ? '音を消す' : '音を出す'}</button>
      <button data-act="quit">ゲームをやめる</button>
      <button data-act="menu">閉じる</button>
    </div>` : '');

  // 中身が変わったときだけ書き換える。key が変わったとき（場面が変わったとき）だけ登場アニメーションをつける
  function setSlot(id, html, key) {
    const el = document.getElementById(id);
    if (!el) return;
    const freshKey = key === undefined ? null : key;
    const isFresh = freshKey !== null && V.fresh[id] !== freshKey;
    V.fresh[id] = freshKey;
    if (el._html === html && !isFresh) return;
    el._html = html;
    el.classList.toggle('is-fresh', isFresh);
    el.innerHTML = html;
  }

  function renderGame() {
    const g = G();
    if (V.built !== g.board.seed || !$('.mapbox')) {
      app.innerHTML = `<header class="bar" id="s-bar"></header><div id="s-menu"></div>
        <main class="game">
          <div class="mapwrap"><div class="mapbox">${mapSVG(g.board)}
            <div class="pieces">${g.players.map((p, i) => `<div class="piece" id="pc-${i}" style="--pc:${p.color}">
              <i class="pc-ring"></i><i class="pc-shadow"></i>
              <div class="pc-lift"><div class="pc-body"><div class="pc-idle">${pawnSVG(p.color, p.name.slice(0, 1))}</div></div><b class="pc-tag" hidden></b></div>
            </div>`).join('')}</div>
          </div></div>
          <div id="s-stand"></div>
          <div id="s-sheet"></div>
        </main>
        <footer class="act" id="s-act"></footer>`;
      V.built = g.board.seed; V.fresh = {};
      initPieces(); measure(); layoutPieces(false); camTo(cur().pos, true);
    }
    const inQ = g.phase === 'question' || g.phase === 'reveal';
    setSlot('s-bar', barHTML(g));
    setSlot('s-menu', menuHTML(g));
    setSlot('s-stand', standings());
    const sheet = $('.qcard'), top = sheet ? sheet.scrollTop : 0;
    setSlot('s-sheet', inQ ? questionHTML() : '', inQ ? g.q.id : '');
    const sh2 = $('.qcard');
    if (sh2 && inQ) {
      sh2.scrollTop = top;
      const ans = document.getElementById('answer');
      if (ans && g.phase === 'reveal') requestAnimationFrame(() => sh2.scrollTo({ top: Math.max(0, ans.offsetTop - sh2.clientHeight * 0.35), behavior: RM ? 'auto' : 'smooth' }));
    }
    const act = document.getElementById('s-act');
    act.className = `act is-${g.phase}${inQ ? ' is-q' : ''}`;
    setSlot('s-act', actionHTML(), `${g.phase}|${g.turn}|${g.q ? g.q.id : ''}|${g.after}|${g.ok}`);
    layoutPieces(true, busy && V.cam.follow >= 0 ? V.cam.follow : -1);
  }

  function resultView() {
    const g = G(), len = g.board.len;
    const rk = g.players.map((p, i) => ({ ...p, i })).sort((a, b) => b.pos - a.pos);
    const w = rk[0];
    return `<main class="result">
      <div class="res-hero">
        <p class="kicker"><span>結果発表</span></p>
        <svg class="res-castle" viewBox="0 0 240 150" aria-hidden="true"><path d="M0 150 V120 Q60 104 120 112 T240 108 V150 Z" fill="#2B2B2B"/>${castleSVG(120, 134)}</svg>
        <div class="champ" style="--pc:${w.color}">
          <svg class="crown" viewBox="0 0 60 40" aria-hidden="true"><path d="M6 34 L3 10 L19 22 L30 4 L41 22 L57 10 L54 34 Z" fill="#FFE14D" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/><circle cx="30" cy="4" r="3.4" fill="#E60012" stroke="${INK}" stroke-width="2"/></svg>
          ${pawnSVG(w.color, w.name.slice(0, 1))}
        </div>
        <h1 class="winner"><span>${esc(w.name)}</span></h1>
        <p class="win-sub">${w.pos >= len ? 'お城に一番乗り！ 優勝' : '一番進んだ人の優勝'}</p>
      </div>
      <ol class="rank">${rk.map((p, n) => `<li style="--pc:${p.color};--at:${Math.min(1, p.pos / len)};--i:${n}">
        <span class="rk">${n + 1}<small>位</small></span>${miniPawn(p.color, p.name.slice(0, 1))}
        <span class="nm">${esc(p.name)}</span><span class="ps">${p.pos >= len ? 'ゴール' : `${p.pos}マス`}</span>
        <span class="bar-t"><i></i></span></li>`).join('')}</ol>
      <p class="sub">ぜんぶで ${g.asked}問</p>
    </main>
    <footer class="act"><button class="big is-red" data-act="again">同じメンバーでもう一回</button><button class="link" data-act="home">はじめの画面へ</button></footer>`;
  }

  // ホームの見出し絵（道とマスと駒）
  function heroArt() {
    const cells = [{ t: 'genre', g: 'food' }, { t: 'all' }, { t: 'genre', g: 'sports' }, { t: 'challenge' }, { t: 'genre', g: 'geography' }];
    const pts = [[38, 112], [100, 86], [164, 108], [228, 82], [292, 100]];
    const d = 'M-10 128 C 20 124, 30 112, 38 112 S 78 84, 100 86 S 140 110, 164 108 S 204 80, 228 82 S 270 102, 292 100 S 340 70, 380 60';
    return `<svg class="hero-art" viewBox="0 0 360 150" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <rect width="360" height="150" fill="#CBE2A0"/>

      <path d="M-10 146 Q80 126 150 150 Z" fill="#69B2D8"/>
      <g transform="translate(318 46) scale(.5)">${castleSVG(0, 60)}</g>
      <g fill="#33734A"><path d="M24 44 l8 -22 l8 22z"/><path d="M48 50 l7 -19 l7 19z"/><path d="M150 40 l8 -22 l8 22z"/><path d="M186 48 l7 -18 l7 18z"/><path d="M252 38 l6 -16 l6 16z"/></g>
      <path d="${d}" stroke="#7A5C34" stroke-width="23" fill="none" stroke-linecap="round"/>
      <path d="${d}" stroke="#E2C88E" stroke-width="19" fill="none" stroke-linecap="round"/>
      <path d="${d}" stroke="#EEDCAE" stroke-width="11" fill="none" stroke-linecap="round"/>
      ${cells.map((c, i) => token(c, pts[i][0], pts[i][1], 14)).join('')}
      <g transform="translate(148 62) scale(.86)">${pawnSVG(COLORS[1], '').replace(/<\/?svg[^>]*>/g, '')}</g>
      <g transform="translate(83 40) scale(.86)">${pawnSVG(COLORS[0], '').replace(/<\/?svg[^>]*>/g, '')}</g>

  function homeView() {
    const s = state.setup;
    const resume = state.game && state.screen !== 'result' && state.game.winner === null;
    const h = (n, t, sm = '') => `<h2><i>${n}</i>${t}${sm ? `<small>${sm}</small>` : ''}</h2>`;
    return `<main class="home">
        <section class="hero">
          <div class="hero-top">
            <p class="onair"><i></i>スマホ1台を回して遊ぶ</p>
            <h1 class="logo"><span class="l1">すごろく</span><span class="l2">クイズ</span></h1>
            <div class="hero-die">${dieHTML('is-idle')}</div>
          </div>
          ${heroArt()}
        </section>
        <section class="form">
          ${h(1, 'プレイヤー', '2〜6人')}
          <div class="players">${s.players.map((n, i) => `<div class="pin" style="--pc:${COLORS[i]}">
            ${miniPawn(COLORS[i], (n.trim() || String(i + 1)).slice(0, 1))}
            <input id="pl-${i}" data-player="${i}" value="${esc(n)}" placeholder="プレイヤー${i + 1}" maxlength="10" enterkeyhint="next" autocomplete="off">
            ${s.players.length > 2 ? `<button class="x" data-act="delPlayer" data-i="${i}" aria-label="削除">×</button>` : ''}
          </div>`).join('')}</div>
          ${s.players.length < 6 ? `<button class="add" data-act="addPlayer">＋ プレイヤーを追加</button>` : ''}
          ${h(2, 'コースの長さ')}
          <div class="seg">${[[15, 'さくっと'], [20, 'ふつう'], [30, 'じっくり']].map(([v, l]) => `<button class="${s.len === v ? 'is-on' : ''}" data-act="len" data-v="${v}">${l}<small>${v}マス</small></button>`).join('')}</div>
          ${h(3, '問題の難しさ')}
          <div class="seg">${[['easy', 'やさしめ'], ['normal', 'ふつう'], ['hard', 'むずかしい']].map(([v, l]) => `<button class="${s.level === v ? 'is-on' : ''}" data-act="level" data-v="${v}">${l}</button>`).join('')}</div>
          ${h(4, 'お酒マス', 'テキーラ・メガジョッキ')}
          <div class="seg">${[[true, 'あり'], [false, 'なし']].map(([v, l]) => `<button class="${s.drinks === v ? 'is-on' : ''}" data-act="drinks" data-v="${v ? 1 : 0}">${l}</button>`).join('')}</div>
          ${h(5, '出さないジャンル', 'タップで外す')}
          <div class="chips">${Object.entries(GENRES).map(([g, [l, , col]]) => `<button class="chip${s.ng.includes(g) ? ' is-ng' : ''}" style="--gc:${col}" data-act="ng" data-g="${g}"><i></i>${l}</button>`).join('')}</div>
          <details class="howto"><summary>遊び方</summary>
            <ol>
              <li>自分の番はサイコロを振って進む。草原から森・大河・宿場町・山を越えて、お城を目指す</li>
              <li>止まったマスのジャンルの問題に答える。正解ならそこに残れる、不正解なら元の場所に戻る</li>
              <li>4択はタップ、それ以外は声に出して答えてから「答えを見る」でみんなで判定</li>
              <li>ストップマス（関所・峠・城門）は通り過ぎられず必ず止まる。正解すると2マス進める</li>
              <li>チャレンジは難しい問題で、正解すると3マス進む。全員クイズは早い者勝ち</li>
            </ol>
          </details>
        </section>
      </main>
      <footer class="act is-home">
        ${resume ? `<button class="big is-white" data-act="resume">続きから遊ぶ</button>` : ''}
        <button class="big is-red" data-act="start">ゲームスタート</button>
      </footer>`;
  }

  let lastScreen = null;
  function render() {
    const scr = state.screen === 'game' && state.game ? 'game' : state.screen === 'result' && state.game ? 'result' : 'home';
    const changed = scr !== lastScreen;
    lastScreen = scr;
    document.body.dataset.screen = scr;
    if (scr === 'game') { renderGame(); return; }
    V.built = null;
    const main = app.querySelector('main'), top = main && !changed ? main.scrollTop : 0;
    app.classList.toggle('is-fresh', changed);
    app.innerHTML = scr === 'result' ? resultView() : homeView();
    const m2 = app.querySelector('main');
    if (m2) m2.scrollTop = top;
  }

  // ---------- 操作 ----------
  const actions = {
    start: startGame,
    resume() { state.screen = 'game'; Sound.unlock(); Sfx.unlock(); commit(); },
    again() { state.setup.players = state.game.players.map(p => p.name); startGame(); },
    home() { state.screen = 'home'; commit(); },
    addPlayer() { if (state.setup.players.length < 6) { state.setup.players.push(''); commit(); document.getElementById(`pl-${state.setup.players.length - 1}`)?.focus(); } },
    delPlayer(d) { state.setup.players.splice(Number(d.i), 1); commit(); },
    len(d) { state.setup.len = Number(d.v); commit(); },
    level(d) { state.setup.level = d.v; commit(); },
    drinks(d) { state.setup.drinks = d.v === '1'; commit(); },
    ng(d) { const a = state.setup.ng, i = a.indexOf(d.g); if (i >= 0) a.splice(i, 1); else a.push(d.g); commit(); },
    roll,
    resolve: resolveCell,
    show() { const g = G(); if (busy || g.phase !== 'question') return; g.phase = 'reveal'; sound('reveal'); commit(); },
    judge(d) { if (!busy && G().phase === 'reveal' && G().ok === null) judge(d.v === '1'); },
    choose(d) { choose(Number(d.i)); },
    allOk(d) { const a = G().allOk, i = Number(d.i), k = a.indexOf(i); if (k >= 0) a.splice(k, 1); else a.push(i); sfx('tap'); commit(); },
    afterReveal,
    drink(d) { drink(d.v === '1'); },
    next: proceed,
    menu() { menuOpen = !menuOpen; render(); },
    undo,
    sound() { state.setup.sound = !state.setup.sound; closeMenu(); commit(); toast(state.setup.sound ? '音を出します' : '音を消しました'); },
    quit() { if (busy) return; closeMenu(); state.screen = 'home'; commit(); },
  };

  document.addEventListener('pointerdown', e => {
    if (!Sound.ready()) Sound.unlock();
    Sfx.unlock();
    // 地図を指で動かしたら、カメラは手を離す
    if (e.target.closest && e.target.closest('.mapwrap') && V.cam.follow < 0) V.cam.run = false;
  }, { capture: true });
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const fn = actions[b.dataset.act];
    if (b.classList.contains('big') || b.classList.contains('seg-b')) sfx('tap');
    if (fn) fn(b.dataset, b);
  });
  document.addEventListener('input', e => {
    const i = e.target.dataset.player;
    if (i === undefined) return;
    state.setup.players[Number(i)] = e.target.value; save();
    const t = e.target.parentElement.querySelector('.pawn text');
    if (t) t.textContent = (e.target.value.trim() || String(Number(i) + 1)).slice(0, 1);
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.target.dataset.player === undefined) return;
    e.preventDefault();
    const nx = document.getElementById(`pl-${Number(e.target.dataset.player) + 1}`);
    if (nx) nx.focus(); else e.target.blur();
  });
  let rsT;
  window.addEventListener('resize', () => {
    clearTimeout(rsT);
    rsT = setTimeout(() => { if (state.screen === 'game' && state.game && $('.mapbox')) { measure(); layoutPieces(false, busy ? V.cam.follow : -1); if (!busy) camTo(cur().pos, true); } }, 80);
  });

  // 以前の保存データに入っていた座標は使わない（毎回作り直す）
  if (state.game && state.game.board) { delete state.game.board.nodes; delete state.game.board.H; }
  // アニメーションの途中でアプリが閉じられた場合は、手番の頭からやり直す
  if (state.game && ['rolling', 'moving'].includes(state.game.phase)) {
    const g = state.game;
    if (g.hist.length && g.phase === 'moving') Object.assign(g, JSON.parse(g.hist.pop()));
    g.phase = 'turn'; g.msg = ''; g.q = null; g.dice = null;
    save();
  }

  // ---------- オフライン対応（ホーム画面に追加して使う） ----------
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => { /* 登録できない環境 */ });
  }

  render();
})();

</script>
</body>
</html>
