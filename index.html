<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="すごろくクイズ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>すごろくクイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* スマホ1台を回して遊ぶすごろく。上に紙の地図、下に親指で押す操作卓。白・黒・ON AIR の赤・マーカーの黄。
   影はぼかさず「厚み」で見せる（押すと沈むボタン、厚みのあるマス） */
:root {
  --paper: #F2F2EE;
  --white: #FFFFFF;
  --rule: #D5D5D0;
  --ink: #141414;
  --sub: #5F5F58;
  --onair: #E60012;
  --marker: #FFE14D;
  --amber: #F4B32C;
  --font: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  --pad-l: max(16px, env(safe-area-inset-left, 0px));
  --pad-r: max(16px, env(safe-area-inset-right, 0px));
  --pop: cubic-bezier(.2, 1.5, .4, 1);
  --out: cubic-bezier(.2, .9, .25, 1);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { margin: 0; background: var(--ink); color: var(--ink); font-family: var(--font); font-size: 16px; font-weight: 500; line-height: 1.5; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--onair); outline-offset: 2px; }
#app { height: 100dvh; display: flex; flex-direction: column; background: var(--white); overflow: hidden; }
#app > main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }

/* ---- 上の帯 ---- */
.bar {
  position: relative; z-index: 10; display: flex; align-items: center; gap: 10px; flex: none;
  padding: calc(6px + env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 6px var(--pad-l);
  background: var(--ink); color: var(--white);
}
.bar .title { font-weight: 900; font-size: 15px; letter-spacing: .06em; white-space: nowrap; }
.bar .title::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--onair); margin-right: 8px; vertical-align: 1px; }
.bar .count { font-size: 12px; font-weight: 700; color: #C9C9C4; margin-left: auto; white-space: nowrap; }
.bar .count b { display: inline-block; background: var(--onair); color: var(--white); font-weight: 900; padding: 0 7px; margin-right: 8px; transform: skewX(-8deg); font-variant-numeric: tabular-nums; }
.bar .icon { border: 0; background: transparent; width: 44px; height: 36px; display: grid; place-content: center; gap: 4px; padding: 0; }
.bar .icon i { display: block; width: 20px; height: 2.5px; background: var(--white); }
.menu-back { position: fixed; inset: 0; z-index: 19; }
.menu { position: fixed; z-index: 20; top: calc(46px + env(safe-area-inset-top, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); background: var(--white); border: 2.5px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); display: grid; min-width: 190px; animation: menuIn .16s var(--out); transform-origin: 100% 0; }
@keyframes menuIn { from { transform: scale(.9); opacity: 0; } }
.menu button { border: 0; border-bottom: 1px solid var(--rule); background: var(--white); text-align: left; padding: 15px 16px; font-size: 16px; font-weight: 700; }
.menu button:disabled { color: #AAA; }
.menu button:last-child { border-bottom: 0; color: var(--sub); }

/* ---- 下の操作卓 ---- */
.act {
  position: relative; z-index: 15; flex: none; display: grid; gap: 10px; align-content: end;
  padding: 12px var(--pad-r) calc(12px + env(safe-area-inset-bottom, 0px)) var(--pad-l);
  background: var(--white); border-top: 3px solid var(--ink);
  min-height: calc(186px + env(safe-area-inset-bottom, 0px));
}
.act.is-q, .act.is-home { min-height: 0; }
body[data-screen="result"] .act { min-height: 0; }
.act.is-fresh > * { animation: actIn .3s var(--out) backwards; }
.act.is-fresh > *:nth-child(2) { animation-delay: .05s; }
.act.is-fresh > *:nth-child(3) { animation-delay: .1s; }
@keyframes actIn { from { transform: translateY(14px); opacity: 0; } }

/* 押すと沈むボタン */
.big {
  width: 100%; min-height: 60px; padding: 10px 14px; margin-bottom: 5px;
  border: 2.5px solid var(--ink); border-radius: 10px; background: #2B2B2B; color: var(--white);
  font-size: 20px; font-weight: 900; letter-spacing: .04em; line-height: 1.2;
  box-shadow: 0 5px 0 var(--ink); transition: transform .07s, box-shadow .07s;
}
.big:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.big:disabled { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); opacity: .55; }
.big.is-red { background: var(--onair); }
.big.is-white { background: var(--white); color: var(--ink); }
.big.is-yellow { background: var(--marker); color: var(--ink); }
.big.is-amber { background: var(--amber); color: var(--ink); }
.big i { font-style: normal; font-size: 24px; margin-right: 6px; vertical-align: -2px; }
.big .nx { display: inline-block; background: var(--pc); padding: 0 9px 1px; margin: 0 2px; border-radius: 4px; box-shadow: 0 0 0 2px var(--white); }
.judge { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.link { border: 0; background: transparent; color: var(--sub); text-decoration: underline; text-underline-offset: 3px; padding: 8px; font-size: 14px; }
.sub { margin: 0; color: var(--sub); font-size: 13px; font-weight: 700; text-align: center; }
.sub.is-left { text-align: left; margin-top: 4px; }
.sub mark { background: var(--marker); color: var(--ink); padding: 1px 6px; }
.hint { margin: 0; color: var(--sub); font-size: 14px; font-weight: 700; text-align: center; }
.msg { margin: 0; font-weight: 700; font-size: 15px; line-height: 1.45; text-align: center; text-wrap: balance; }
.mini-pawn { display: inline-block; flex: none; width: 30px; }
.mini-pawn .pawn { display: block; width: 100%; height: auto; overflow: visible; }
.who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.who .mini-pawn { width: 34px; }
.who-t { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.who-t b { font-size: 27px; font-weight: 900; line-height: 1.15; border-bottom: 5px solid var(--pc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who-t small { font-size: 15px; font-weight: 700; white-space: nowrap; }
.turn-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 84px; }
.die-btn { position: relative; border: 0; background: transparent; width: 92px; height: 84px; padding: 0; display: grid; place-items: center; }
.die-btn::before { content: ""; position: absolute; left: 18px; right: 14px; bottom: 4px; height: 12px; border-radius: 50%; background: rgba(0, 0, 0, .16); }
.die-btn:active .die { transform: scale(.92); }

.toast { position: fixed; left: 50%; bottom: calc(120px + env(safe-area-inset-bottom, 0px)); z-index: 60; transform: translateX(-50%); opacity: 0; pointer-events: none; background: var(--ink); color: var(--white); border: 2px solid var(--white); padding: 8px 14px; font-size: 14px; font-weight: 700; transition: opacity .15s; max-width: calc(100vw - 32px); white-space: nowrap; }
.toast.is-on { opacity: 1; }

/* ---- サイコロ（立方体） ---- */
.die { --s: 62px; position: relative; width: var(--s); height: var(--s); perspective: calc(var(--s) * 7); transition: transform .08s; }
.die .cube, .die .shade { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateX(-24deg) rotateY(-28deg); }
.f { position: absolute; inset: 0; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); place-items: center; padding: 13%; background: #FBF8EF; border: calc(var(--s) * .045) solid var(--ink); border-radius: 15%; backface-visibility: hidden; }
.f i { display: block; }
.f i.p { width: 76%; aspect-ratio: 1; border-radius: 50%; background: var(--ink); }
.f1 i.p { width: 150%; background: var(--onair); }
.f1 { transform: translateZ(calc(var(--s) / 2)); }
.f6 { transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
.f3 { transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }
.f4 { transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
.f5 { transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }
.f2 { transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }
/* 止まっているときだけ、上面を明るく・側面を暗くして立体に見せる */
.shade { opacity: 0; pointer-events: none; }
.shade i { position: absolute; inset: 0; border-radius: 15%; backface-visibility: hidden; }
.shade .sr { transform: rotateY(90deg) translateZ(calc(var(--s) / 2 + .5px)); background: rgba(0, 0, 0, .2); }
.shade .st { transform: rotateX(90deg) translateZ(calc(var(--s) / 2 + .5px)); background: rgba(255, 255, 255, .0); }
.shade .sf { transform: translateZ(calc(var(--s) / 2 + .5px)); background: rgba(0, 0, 0, .07); }
.die.is-idle .shade, .dstage.is-set .shade { opacity: 1; }
.die.is-idle { animation: dieBob 2.2s ease-in-out infinite; }
@keyframes dieBob { 0%, 100% { translate: 0 0; rotate: -3deg; } 50% { translate: 0 -5px; rotate: 3deg; } }
.die2d { position: relative; display: inline-block; width: 46px; height: 46px; --s: 46px; flex: none; }
.die2d .f { transform: none; box-shadow: 0 3px 0 var(--ink); }

/* 振ったサイコロが転がる舞台 */
#fx { position: fixed; inset: 0; z-index: 50; overflow: hidden; pointer-events: none; }
.dstage { position: absolute; inset: 0; animation: scrim .35s .25s both; transition: opacity .2s; }
@keyframes scrim { from { background: rgba(20, 20, 20, 0); } to { background: rgba(20, 20, 20, .34); } }
.dstage.is-out { opacity: 0; }
.ds-die { position: absolute; left: 0; top: 0; width: 88px; height: 88px; will-change: transform; }
.ds-die .die { --s: 88px; }
.ds-shadow { position: absolute; left: 0; top: 0; width: 88px; height: 20px; border-radius: 50%; background: #000; will-change: transform; }
.ds-call { position: absolute; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; background: var(--marker); border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); padding: 0 18px 2px; translate: -50% 0; transform: skewX(-8deg) scale(.3); opacity: 0; }
.ds-call b { font-size: 46px; font-weight: 900; line-height: 1.15; font-variant-numeric: tabular-nums; }
.ds-call span { font-size: 17px; font-weight: 900; }
.dstage.is-set .ds-call { animation: callIn .34s .1s var(--pop) forwards; }
@keyframes callIn { to { transform: skewX(-8deg) scale(1); opacity: 1; } }

/* ---- ホーム ---- */
.home { background: var(--white); }
.hero { background: var(--ink); color: var(--white); padding-top: env(safe-area-inset-top, 0px); }
.hero-top { position: relative; padding: 18px var(--pad-r) 16px calc(var(--pad-l) + 4px); }
.onair { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: #D8D8D2; }
.onair i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--onair); margin-right: 8px; animation: lamp 1.6s steps(1) infinite; }
@keyframes lamp { 50% { opacity: .25; } }
.logo { margin: 8px 0 0; font-weight: 900; line-height: 1; }
.logo .l1 { display: block; font-size: clamp(44px, 14vw, 58px); letter-spacing: .02em; }
.logo .l2 { display: inline-block; margin-top: 10px; font-size: clamp(34px, 11vw, 46px); background: var(--marker); color: var(--ink); padding: 5px 16px 7px; transform: skewX(-8deg) rotate(-2deg); transform-origin: 0 100%; }
.hero-die { position: absolute; right: calc(var(--pad-r) + 16px); bottom: 22px; }
.hero-die .die { --s: 60px; }
.hero-art { display: block; width: 100%; height: 132px; border-top: 3px solid var(--marker); border-bottom: 3px solid var(--ink); }
.hero-art text { font-family: var(--font); }
#app.is-fresh .logo .l1 { animation: logoIn .5s var(--out) backwards; }
#app.is-fresh .logo .l2 { animation: logo2In .45s .18s var(--pop) backwards; }
#app.is-fresh .hero-die { animation: dieDrop .6s .35s var(--pop) backwards; }
@keyframes logoIn { from { transform: translateX(-24px); opacity: 0; } }
@keyframes logo2In { from { transform: skewX(-8deg) rotate(-2deg) scale(.5); opacity: 0; } }
@keyframes dieDrop { from { transform: translateY(-70px) rotate(-120deg); opacity: 0; } }
.form { padding: 2px var(--pad-r) 28px var(--pad-l); }
.form h2 { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 900; margin: 24px 0 10px; }
.form h2 i { display: grid; place-items: center; width: 24px; height: 24px; background: var(--ink); color: var(--white); font-style: normal; font-size: 14px; font-weight: 900; }
.form h2 small { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--sub); }
.players { display: grid; }
.pin { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; border-bottom: 2px solid var(--ink); padding: 3px 0 3px 4px; }
.pin input { border: 0; padding: 11px 6px; font-size: 19px; font-weight: 700; min-width: 0; background: transparent; border-radius: 0; }
.pin input::placeholder { color: #B5B5AE; font-weight: 500; }
.pin input:focus { outline: none; background: #FFF6BF; }
.pin .x { border: 0; background: transparent; color: var(--sub); font-size: 22px; width: 44px; height: 44px; }
.add { width: 100%; margin-top: 12px; border: 2px dashed #9A9A93; border-radius: 8px; background: transparent; color: var(--sub); font-size: 15px; font-weight: 700; padding: 11px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.seg button { border: 2.5px solid var(--ink); border-radius: 8px; background: var(--white); padding: 9px 4px; min-height: 50px; font-size: 16px; font-weight: 900; line-height: 1.25; box-shadow: 0 4px 0 var(--ink); margin-bottom: 4px; transition: transform .07s, box-shadow .07s; }
.seg button small { display: block; font-size: 11px; font-weight: 700; color: var(--sub); }
.seg button.is-on { background: var(--ink); color: var(--white); transform: translateY(4px); box-shadow: none; }
.seg button.is-on small { color: var(--marker); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 2px solid var(--ink); background: var(--white); border-radius: 999px; padding: 6px 13px 6px 9px; font-size: 14px; font-weight: 700; min-height: 38px; }
.chip i { width: 13px; height: 13px; border-radius: 50%; background: var(--gc); border: 1.5px solid var(--ink); }
.chip.is-ng { color: #8D8D86; border-color: #8D8D86; border-style: dashed; text-decoration: line-through; }
.chip.is-ng i { background: transparent; border-color: #8D8D86; }
.howto { margin-top: 24px; font-size: 14px; border-top: 1px solid var(--rule); padding-top: 12px; }
.howto summary { font-weight: 700; padding: 6px 0; }
.howto ol { padding-left: 22px; margin: 8px 0 0; display: grid; gap: 6px; }

/* ---- 地図 ---- */
.game { display: flex; flex-direction: column; overflow: hidden !important; position: relative; background: #CBE2A0; }
.mapwrap { position: relative; z-index: 0; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; scrollbar-width: none; background: #CBE2A0; }
.mapwrap::-webkit-scrollbar { display: none; }
.mapbox { position: relative; overflow: hidden; }
.map { display: block; width: 100%; height: auto; }
.map text, .tok text { font-family: var(--font); }
.map .lb { font-size: 11.5px; font-weight: 900; fill: var(--ink); paint-order: stroke; stroke: #FFFDF2; stroke-width: 3.6px; stroke-linejoin: round; }
.map .lb .no { fill: var(--onair); }
.map .lb.is-stop { fill: var(--onair); font-size: 13px; }
.map .lb.is-start, .map .lb.is-goal { font-size: 13px; }
.map .sg { font-size: 11px; font-weight: 900; fill: #3E2A14; }

/* 駒 */
.pieces { position: absolute; inset: 0; pointer-events: none; }
.piece { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; }
.piece.is-slide { transition: transform .38s cubic-bezier(.3, 1.3, .5, 1); }
.pc-shadow { position: absolute; left: -14px; top: -3px; width: 28px; height: 9px; border-radius: 50%; background: #000; opacity: .3; }
.pc-ring { display: none; position: absolute; left: -21px; top: -7px; width: 42px; height: 18px; border-radius: 50%; border: 3px solid var(--marker); box-shadow: 0 0 0 1.5px var(--ink), inset 0 0 0 1.5px var(--ink); }
.piece.is-turn .pc-ring { display: block; animation: ring 1.3s ease-out infinite; }
.piece.is-moving .pc-ring { display: none; }
@keyframes ring { 0% { transform: scale(.7); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
.pc-lift { position: absolute; left: -17px; top: -39px; width: 34px; height: 45px; transform-origin: 50% 39px; will-change: transform; }
.pc-body, .pc-idle { width: 100%; height: 100%; transform-origin: 50% 39px; }
.pc-body { will-change: transform; }
.pawn { display: block; width: 34px; height: 44.2px; overflow: visible; }
.pawn text { font-family: var(--font); }
.piece.is-turn .pc-idle { scale: 1.18; animation: breathe 1.1s ease-in-out infinite; }
.piece.is-turn.is-hop .pc-idle, .piece.is-turn.is-moving .pc-idle { animation: none; }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.05, .93); } }
/* 手番の駒の上の赤い矢印 */
.piece.is-turn .pc-lift::before { content: ""; position: absolute; left: 50%; top: -22px; margin-left: -8px; border: 8px solid transparent; border-top: 11px solid var(--onair); border-bottom: 0; filter: drop-shadow(0 0 0 var(--white)) drop-shadow(0 1.5px 0 var(--white)) drop-shadow(1.5px 0 0 var(--white)) drop-shadow(-1.5px 0 0 var(--white)); animation: arrow .7s ease-in-out infinite alternate; }
.piece.is-turn.is-moving .pc-lift::before { display: none; }
@keyframes arrow { to { transform: translateY(-6px); } }
.pc-tag { position: absolute; left: 50%; top: -30px; translate: -50% 0; min-width: 26px; height: 26px; padding: 0 5px; display: grid; place-items: center; background: var(--marker); border: 2.5px solid var(--ink); border-radius: 13px; font-size: 15px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.pc-tag[hidden] { display: none; }
/* 着地の土ぼこり */
.dust { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 5; }
.dust::before, .dust::after { content: ""; position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: #FBF4DD; border: 1.5px solid rgba(70, 48, 16, .55); animation: puffL .46s ease-out forwards; }
.dust::after { animation-name: puffR; }
.dust.is-big::before, .dust.is-big::after { width: 13px; height: 13px; animation-duration: .6s; }
@keyframes puffL { from { transform: translate(-4px, 0) scale(.5); opacity: 1; } to { transform: translate(-24px, -7px) scale(1.25); opacity: 0; } }
@keyframes puffR { from { transform: translate(4px, 0) scale(.5); opacity: 1; } to { transform: translate(24px, -7px) scale(1.25); opacity: 0; } }

/* 順位ボード */
#s-stand { flex: none; background: var(--white); border-top: 3px solid var(--ink); position: relative; z-index: 6; }
.stand { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
.pl { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 2px 4px; padding: 9px 8px 2px; border-left: 1px solid var(--rule); box-shadow: inset 0 5px 0 var(--pc); min-width: 0; transition: background .2s; }
.pl:first-child { border-left: 0; }
.pl .nm { font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .ps { font-weight: 900; font-size: 20px; line-height: 1.1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pl .ps small { font-size: 10px; font-weight: 700; color: var(--sub); }
.pl .ps em { font-style: normal; font-size: 13px; color: var(--onair); }
.pl.is-narrow { grid-template-columns: minmax(0, 1fr); padding: 8px 5px 2px; gap: 0; }
.pl.is-narrow .ps { font-size: 17px; }
.pl.is-turn { background: var(--marker); }
.pl.is-turn .ps small { color: var(--ink); }
.pl .rest, .pl .lead { position: absolute; top: 0; right: 0; font-size: 9px; font-weight: 900; line-height: 12px; padding: 0 4px; background: var(--ink); color: var(--white); }
.pl .rest { background: var(--onair); }
.race { position: relative; height: 15px; }
.race::before { content: ""; position: absolute; left: 14px; right: 14px; top: 6px; height: 2px; background: var(--ink); }
.race-goal { position: absolute; right: 8px; top: 2px; width: 10px; height: 10px; background: conic-gradient(var(--ink) 25%, var(--white) 0 50%, var(--ink) 0 75%, var(--white) 0); border: 1.5px solid var(--ink); }

"question":"バットとボールを買ったら合計1100円。バットはボールより1000円高い。ボールはいくら？","display":"バット＋ボール＝1100円\nバットはボールより1000円高い\nボールは？","answer":"50円","accept_rule":"「50円」のみ正解。「100円」は不正解","explanation":"100円だとバットは1100円で合計1200円になる。ボール50円、バット1050円で合計1100円。","formats":["buzzer","flip"],"expected_correct_rate":0.48},{"id":"rid-045","genre":"riddle","question":"男がバーで水を頼むと、バーテンダーはいきなり銃を突きつけた。男は「ありがとう」と言って帰った。なぜ？","answer":"しゃっくりを止めたかったから","accept_rule":"「しゃっくり」が出れば正解","explanation":"男はしゃっくりを止めるために水を頼んだ。バーテンダーは驚かせて止めてあげた。","formats":["flip","choice4"],"choices":["しゃっくりを止めたかったから","眠気を覚ましたかったから","酔いを一気に覚ましたかったから","水が無料になったから"],"expected_correct_rate":0.35},{"id":"rid-046","genre":"riddle","question":"1から100までの数を全部書いたとき、数字の「9」は全部で何回出てくる？","answer":"20回","accept_rule":"「20回」のみ正解。near形式なら最も近いチーム","explanation":"一の位の9が10回（9、19…99）、十の位の9が10回（90〜99）。99は2回数えて合計20回。","formats":["flip","near"],"expected_correct_rate":0.35},{"id":"rid-047","genre":"riddle","question":"アナログ時計で3時ちょうどは長針と短針の角度が90度。では3時30分のとき、2つの針がつくる小さいほうの角度は何度？","answer":"75度","accept_rule":"「75度」のみ正解。near形式なら最も近いチーム","explanation":"短針は30分で15度進むので3と4の真ん中。長針は6の位置。差は90−15＝75度。","formats":["flip","near"],"expected_correct_rate":0.3},{"id":"rid-048","genre":"riddle","question":"ある月のカレンダーを見ると、金曜日・土曜日・日曜日がそれぞれ5回ずつあります。この月の1日は何曜日？","answer":"金曜日","accept_rule":"「金曜日」のみ正解","explanation":"31日ある月で、5回ある曜日は1日・2日・3日の曜日だけ。だから1日は金曜日。","formats":["flip","choice4"],"choices":["木曜日","金曜日","土曜日","日曜日"],"expected_correct_rate":0.3},{"id":"rid-049","genre":"riddle","question":"100チームが参加する勝ち抜きトーナメント（引き分けなし）。優勝チームが決まるまでに、試合は全部で何試合行われる？","answer":"99試合","accept_rule":"「99試合」のみ正解。near形式なら最も近いチーム","explanation":"1試合ごとに必ず1チーム負けて消える。99チームが消えれば優勝決定なので99試合。","formats":["flip","near"],"expected_correct_rate":0.35},{"id":"rid-050","genre":"riddle","question":"逆から読むと「互いに（たがいに）」になる都道府県はどこ？","display":"たがいに → 逆から読むと都道府県","answer":"新潟（にいがた）","accept_rule":"「新潟」のみ正解","explanation":"「にいがた」を逆から読むと「たがいに」。","formats":["buzzer","flip"],"expected_correct_rate":0.48},{"id":"rid-051","genre":"riddle","question":"画面に数が10個並んでいます。ある法則があります。「？」に入る数は何？","display":"1　2　3　？　4　4　2　2　2　2","answer":"5","accept_rule":"「5」のみ正解","explanation":"漢数字の画数。一・二・三は1〜3画、四は5画、五と六は4画、七〜十は2画。","formats":["flip"],"expected_correct_rate":0.14},{"id":"rid-052","genre":"riddle","question":"3人の子の年齢をかけると36、足すと隣の家の番地と同じ。番地を見た人はそれでも分からず「一番上はピアノを習ってる」と聞いて分かった。3人の年齢は？","display":"3人の年齢をかけると 36\n足すと隣の家の番地\n「一番上の子はピアノを習っている」","answer":"9歳・2歳・2歳","accept_rule":"「9・2・2」の3つの数字が言えれば正解","explanation":"足して同じになる組は「9・2・2」と「6・6・1」の13だけ。「一番上」が1人いるので9・2・2。","formats":["flip","choice4"],"choices":["9歳・2歳・2歳","6歳・6歳・1歳","6歳・3歳・2歳","4歳・3歳・3歳"],"expected_correct_rate":0.18},{"id":"rid-053","genre":"riddle","question":"1×2×3×…×100と、1から100まで全部かけ算した数。一の位から「0」が何個連続で並ぶ？","answer":"24個","accept_rule":"「24個」のみ正解。near形式なら最も近いチーム","explanation":"0は「2×5」で1つできる。5の倍数が20個、25の倍数はさらに1個ずつで4個、合計24個。","formats":["flip","near"],"expected_correct_rate":0.14},{"id":"rid-054","genre":"riddle","question":"厚さ0.1ミリの紙を半分に折るのを繰り返します。重なった厚さが富士山の高さ（3776m）を超えるのは何回目？","answer":"26回目","accept_rule":"「26回」のみ正解。near形式なら最も近いチーム","explanation":"折るたびに厚さは2倍。25回で約3355m、26回で約6711mと富士山を超える。","formats":["flip","near"],"expected_correct_rate":0.14},{"id":"rid-055","genre":"riddle","question":"ある家の兄は「僕には兄弟と姉妹が同じ数いる」、妹は「私には姉妹の2倍の兄弟がいる」。この家の子どもは男女何人ずつ？","display":"兄「僕には、兄弟と姉妹が同じ数いる」\n妹「私には、姉妹の2倍の兄弟がいる」","answer":"男4人・女3人","accept_rule":"「男4人・女3人」が言えれば正解","explanation":"男をx・女をyとすると x−1＝y、x＝2(y−1)。解くと男4人・女3人。","formats":["flip"],"expected_correct_rate":0.18},{"id":"rid-056","genre":"riddle","question":"画面の1〜9の数字は、ある法則で並んでいます。どんな法則？","display":"8　5　4　9　1　7　6　3　2","answer":"英語にしたときのアルファベット順","accept_rule":"「英語にしてアルファベット順（辞書順）」の趣旨が言えれば正解","explanation":"eight、five、four、nine、one、seven、six、three、two。英語のつづりの辞書順。","formats":["flip"],"conflicts_with":["rid-041"],"expected_correct_rate":0.14},{"id":"sci-001","genre":"science_numbers","question":"昆虫の足は全部で何本？","answer":"6本","accept_rule":"「6」と分かれば正解","explanation":"足6本・体が頭胸腹の3つが昆虫の条件。クモは8本なので昆虫ではない。","formats":["buzzer","flip"],"expected_correct_rate":0.78},{"id":"sci-002","genre":"science_numbers","question":"太陽系の8つの惑星のうち、一番大きい惑星はどれ？","answer":"木星","accept_rule":"「木星」のみ正解","explanation":"直径は地球の約11倍。2位は土星。","formats":["buzzer","flip","choice4"],"choices":["木星","土星","天王星","海王星"],"conflicts_with":["sci-034"],"expected_correct_rate":0.72},{"id":"sci-003","genre":"science_numbers","question":"水を表す化学式は何？","answer":"H2O","accept_rule":"口頭なら「エイチツーオー」、フリップなら H2O / H₂O いずれも可","explanation":"水素(H)2個と酸素(O)1個。ちなみに二酸化炭素はCO2。","formats":["buzzer","flip"],"conflicts_with":["sci-106"],"expected_correct_rate":0.78},{"id":"sci-004","genre":"science_numbers","question":"陸上の動物で、走るスピードが一番速いとされる動物は何？","answer":"チーター","accept_rule":"「チーター」のみ正解","explanation":"最高時速は約100km前後。ただし持続できるのは数百mほど。","formats":["buzzer","flip"],"expected_correct_rate":0.76},{"id":"sci-005","genre":"science_numbers","question":"鉛筆などを数えるときに使う「1ダース」は、何個のこと？","answer":"12個","accept_rule":"「12」と分かれば正解","explanation":"12ダース（144個）は「1グロス」という。","formats":["buzzer","flip"],"expected_correct_rate":0.76},{"id":"sci-006","genre":"science_numbers","question":"2006年、「惑星」から「準惑星」に格下げされ、太陽系の惑星が9個から8個になった。その天体は何？","answer":"冥王星","accept_rule":"「冥王星」「プルート」いずれも正解","explanation":"小学生のころ習った「すいきんちかもくどってんかいめい」の「めい」。国際天文学連合の総会で決定。","formats":["buzzer","flip"],"expected_correct_rate":0.56},{"id":"sci-007","genre":"science_numbers","question":"自ら光る星を「恒星（こうせい）」といいます。では、地球から一番近い恒星は何？","answer":"太陽","accept_rule":"「太陽」のみ正解。「プロキシマ・ケンタウリ」は太陽の次なので不正解","explanation":"太陽も恒星のひとつ。太陽の次に近いのは約4.2光年先のプロキシマ・ケンタウリ。","formats":["buzzer","flip"],"expected_correct_rate":0.68},{"id":"sci-008","genre":"science_numbers","question":"地球の空気（大気）の中で、体積の割合が一番多い気体は何？","answer":"窒素","accept_rule":"「窒素」のみ正解。「酸素」は不正解","explanation":"窒素が約78%、酸素は約21%。酸素は2位。","formats":["buzzer","flip","choice4"],"choices":["窒素","酸素","二酸化炭素","アルゴン"],"expected_correct_rate":0.76},{"id":"sci-009","genre":"science_numbers","question":"ダイヤモンドと、鉛筆の芯の主成分「黒鉛」。実はどちらも同じ元素だけでできています。その元素は何？","answer":"炭素","accept_rule":"「炭素」「カーボン」「C」いずれも正解","explanation":"原子の並び方が違うだけ。黒鉛はグラファイトとも呼ばれる。","formats":["buzzer","flip"],"conflicts_with":["sci-045"],"expected_correct_rate":0.79},{"id":"sci-010","genre":"science_numbers","question":"2012年、iPS細胞（アイピーエスさいぼう）の研究でノーベル生理学・医学賞を受賞した日本人は誰？","answer":"山中伸弥","accept_rule":"姓のみ「山中」でも正解","explanation":"京都大学の教授。iPSの「i」が小文字なのはiPodにあやかったという話は本人談。","formats":["buzzer","flip"],"conflicts_with":["sci-044","sci-046"],"expected_correct_rate":0.52},{"id":"sci-011","genre":"science_numbers","question":"一般的なサイコロで、「1」の目のちょうど裏側にあるのは、いくつの目？","answer":"6","accept_rule":"「6」と分かれば正解","explanation":"サイコロは裏表を足すと必ず7。2の裏は5、3の裏は4。","formats":["buzzer","flip"],"expected_correct_rate":0.76},{"id":"sci-012","genre":"science_numbers","question":"A・B・O・ABの4つの血液型のうち、日本人に一番多い血液型はどれ？","answer":"A型","accept_rule":"「A型」のみ正解","explanation":"ざっくりA型4割・O型3割・B型2割・AB型1割。世界全体で見るとO型が最多。","formats":["buzzer","flip","choice4"],"choices":["A型","B型","O型","AB型"],"expected_correct_rate":0.56},{"id":"sci-013","genre":"science_numbers","question":"テレビやスマホの画面は「光の三原色」で色を作っています。赤・緑と、あと1色は何？","answer":"青","accept_rule":"「青」「ブルー」いずれも正解","explanation":"RGBのB。絵の具の三原色（シアン・マゼンタ・イエロー）とは別もの。","formats":["buzzer","flip"],"expected_correct_rate":0.62},{"id":"sci-014","genre":"science_numbers","question":"稲妻（いなずま）が光ってから、約3秒後に雷の音が聞こえました。雷までの距離はおよそ何km？","answer":"約1km","accept_rule":"0.9〜1.2kmの範囲なら正解","explanation":"音は1秒に約340m進むので、3秒で約1km。光は一瞬で届く。","formats":["buzzer","flip","choice4"],"choices":["約100m","約1km","約10km","約30km"],"expected_correct_rate":0.6},{"id":"sci-015","genre":"science_numbers","question":"数の単位、一・十・百・千・万・億・兆。では「兆」の次にくる単位は何？","answer":"京","accept_rule":"「京（けい）」のみ正解","explanation":"1京＝1兆の1万倍。スパコン「京」の名前の由来。その次は「垓（がい）」。","formats":["buzzer","flip"],"expected_correct_rate":0.68},{"id":"sci-016","genre":"science_numbers","question":"1から100までの整数を全部足すと、合計はいくつ？","answer":"5050","accept_rule":"ニアピンの場合は最も近いチームが勝ち。通常は「5050」のみ正解","explanation":"1+100、2+99…と101のペアが50組できるので101×50。数学者ガウスの少年時代の逸話で有名。","formats":["flip","near"],"expected_correct_rate":0.52},{"id":"sci-017","genre":"science_numbers","question":"人間が舌で感じる「基本の五味」。甘味・塩味・酸味・苦味と、あと1つは何？","answer":"うま味","accept_rule":"「うま味」のみ正解。「辛味」「渋味」は不正解（痛覚・触覚）","explanation":"日本人・池田菊苗（きくなえ）が昆布だしから発見。英語でもUMAMI。","formats":["buzzer","flip"],"expected_correct_rate":0.68},{"id":"sci-018","genre":"science_numbers","question":"人間の血が赤いのは、赤血球のヘモグロビンに含まれる、ある金属のせい。その金属は何？","answer":"鉄","accept_rule":"「鉄」のみ正解","explanation":"鉄が酸素と結びついて赤くなる。貧血対策に鉄分を摂るのはこのため。","formats":["buzzer","flip"],"expected_correct_rate":0.76},{"id":"sci-019","genre":"science_numbers","question":"白黒模様で笹を食べるジャイアントパンダ。動物の分類では「何科」の動物？","answer":"クマ科","accept_rule":"「クマ科」「クマ」で正解。「パンダ科」「アライグマ科」は不正解","explanation":"DNA解析でクマの仲間と確定。レッサーパンダは別の「レッサーパンダ科」。","formats":["buzzer","flip","choice4"],"choices":["クマ科","アライグマ科","イヌ科","ネコ科"],"expected_correct_rate":0.48},{"id":"sci-020","genre":"science_numbers","question":"2012年5月21日の朝、東京では173年ぶりに観測され、専用メガネが品薄になった天体ショーは何？","answer":"金環日食","accept_rule":"「金環日食」「金環食」で正解。ただの「日食」は再回答を促す","explanation":"九州南部から関東までの帯状の地域で、太陽がリング状に。次に東京で見られるのは2312年。","formats":["buzzer","flip"],"expected_correct_rate":0.68},{"id":"sci-021","genre":"science_numbers","question":"大人の人間の体にある骨の数は、一般的に全部で何本といわれる？","answer":"206本","accept_rule":"ニアピン形式では最も近いチームが勝ち。通常形式では196〜216本で正解","explanation":"赤ちゃんは約300個（諸説あり）あり、成長とともにくっついて約206本になる。","formats":["flip","near"],"expected_correct_rate":0.4},{"id":"sci-022","genre":"science_numbers","question":"次の4つを、小さいものから順に並べてください。「髪の毛の太さ」「赤血球」「細菌」「ウイルス」","answer":"ウイルス → 細菌 → 赤血球 → 髪の毛の太さ","accept_rule":"完全一致のみ正解","explanation":"ウイルス約0.1μm、細菌約1μm、赤血球約8μm、髪の毛約80μm。それぞれ約10倍ずつ違う。","formats":["order","flip"],"expected_correct_rate":0.4},{"id":"sci-023","genre":"science_numbers","question":"人間の首の骨（頸椎・けいつい）は7個。では、あの長い首のキリンの首の骨は何個？","answer":"7個","accept_rule":"「7」と分かれば正解","explanation":"哺乳類はほぼ全部7個。キリンは1個1個が約30cmと巨大なだけ。","formats":["buzzer","flip","choice4"],"choices":["7個","14個","21個","35個"],"expected_correct_rate":0.44},{"id":"sci-024","genre":"science_numbers","question":"2016年、日本が発見して命名権を得た元素「ニホニウム」。その原子番号は何番？","answer":"113","accept_rule":"ニアピン形式では最も近いチームが勝ち。通常形式は「113」のみ正解","explanation":"元素記号はNh。理化学研究所の森田浩介グループが合成。アジア初の命名元素。","formats":["flip","near","choice4"],"choices":["103","113","118","131"],"expected_correct_rate":0.27},{"id":"sci-025","genre":"science_numbers","question":"太陽の光が地球に届くまでにかかる時間は、およそ何分何秒？","answer":"約8分20秒","accept_rule":"ニアピン形式では最も近いチームが勝ち。通常形式では7分30秒〜9分で正解","explanation":"太陽までは約1億5千万km、光は秒速30万km。今見ている太陽は8分前の姿。","formats":["flip","near"],"expected_correct_rate":0.44},{"id":"sci-026","genre":"science_numbers","question":"2010年、数々のトラブルを乗り越え地球に帰還した探査機「はやぶさ」。砂を持ち帰った小惑星の名前は？","answer":"イトカワ","accept_rule":"「イトカワ」のみ正解。「リュウグウ」は「はやぶさ2」なので不正解","explanation":"日本のロケット開発の父・糸川英夫にちなむ名前。はやぶさ2が2020年に持ち帰ったのはリュウグウ。","formats":["buzzer","flip"],"expected_correct_rate":0.44},{"id":"sci-027","genre":"science_numbers","question":"円周率は 3.14159… と続きます。では「3.14159」の次にくる数字は何？","display":"3.14159？","answer":"2","accept_rule":"「2」のみ正解","explanation":"3.14159 26535 89793…。「産医師異国に向こう（3.14159265）」の語呂合わせで覚えた人も。","formats":["buzzer","flip"],"expected_correct_rate":0.4},{"id":"sci-028","genre":"science_numbers","question":"1990年、ソ連の宇宙船で日本人として初めて宇宙へ行ったのは、当時TBSの記者だった誰？","answer":"秋山豊寛","accept_rule":"姓のみ「秋山」でも正解。「毛利衛」は不正解（日本人初のスペースシャトル搭乗者）","explanation":"ソユーズで宇宙ステーション「ミール」に滞在。毛利衛さんは1992年で2人目。","formats":["buzzer","flip","choice4"],"choices":["秋山豊寛","毛利衛","向井千秋","若田光一"],"expected_correct_rate":0.14},{"id":"sci-029","genre":"science_numbers","question":"大人の人間の体は、およそ何兆個の細胞でできている？ 2013年に発表された研究の推定値で答えてください。","answer":"約37兆個","accept_rule":"ニアピン形式：最も近いチームが勝ち。通常形式では30〜45兆で正解。昔の教科書の「60兆」は不正解","explanation":"長らく「60兆個」といわれてきたが、2013年に臓器ごとに積み上げた推定で約37兆個に。2023年の研究では成人男性約36兆個とも。","formats":["flip","near"],"expected_correct_rate":0.1},{"id":"sci-030","genre":"science_numbers","question":"人間の血は鉄のせいで赤い。では、タコやイカの血が青いのは、ある金属のせい。その金属は何？","answer":"銅","accept_rule":"「銅」のみ正解","explanation":"ヘモグロビンの代わりに銅を含む「ヘモシアニン」で rrect_rate":0.57,"five":"カモノハシ"},{"id":"sci-530","genre":"science_numbers","question":"昆虫ではなく、エビやカニと同じ甲殻類の仲間。触ると丸くなることで知られる、庭や石の下にいる身近な生き物は？","answer":"ダンゴムシ","accept_rule":"カタカナ・ひらがな可。5文字形式では five の読みで判定","explanation":"正式にはオカダンゴムシ。似ているワラジムシは丸くなれない。","formats":["five","flip"],"expected_correct_rate":0.54,"five":"ダンゴムシ"},{"id":"sci-531","genre":"science_numbers","question":"窒素と水素からできる、刺激臭のある気体。化学式はNH3。肥料の原料にもなるこの物質は？","answer":"アンモニア","accept_rule":"カタカナ・ひらがな可。5文字形式では five の読みで判定","explanation":"ハーバー・ボッシュ法で大量生産できるようになり、化学肥料が普及した。","formats":["five","flip"],"expected_correct_rate":0.62,"five":"アンモニア"},{"id":"kanji-532","genre":"kanji_words","question":"画面の漢字は食べ物の名前。何と読む？","display":"蒟蒻","answer":"こんにゃく","accept_rule":"ひらがな・カタカナ可。5文字形式では five の読みで判定","explanation":"「蒟蒻」。おでんや刺身こんにゃくでおなじみ。原料はコンニャクイモ。","formats":["five","flip"],"expected_correct_rate":0.65,"five":"こんにゃく"},{"id":"kanji-533","genre":"kanji_words","question":"画面の漢字は生き物の名前。何と読む？","display":"蝸牛","answer":"かたつむり","accept_rule":"ひらがな・カタカナ可。「かぎゅう」は不可（生き物の名前として）。5文字形式では five の読みで判定","explanation":"「蝸牛」。耳の中の渦巻き状の器官「蝸牛（かぎゅう）」も同じ字。","formats":["five","flip"],"expected_correct_rate":0.58,"five":"かたつむり"},{"id":"kanji-534","genre":"kanji_words","question":"自分で自分のことをほめること。「絵」に関する字を使った四字熟語は？","answer":"自画自賛","accept_rule":"漢字・ひらがな可。5文字形式では five の読みで判定","explanation":"もとは自分が描いた絵に自分で賛（詩文）を書き入れること。","formats":["five","flip"],"expected_correct_rate":0.7,"five":"じがじさん"},{"id":"kanji-535","genre":"kanji_words","question":"画面の漢字は食べ物の名前。何と読む？","display":"心太","answer":"ところてん","accept_rule":"ひらがな・カタカナ可。5文字形式では「ところてん」","explanation":"「心太」。テングサから作り、天突きで突き出して食べる。","formats":["five","flip"],"expected_correct_rate":0.55,"five":"ところてん"},{"id":"kanji-536","genre":"kanji_words","question":"ぜんまいを巻くと自動で音楽を奏でる箱。英語では「ミュージックボックス」。日本ではオランダ語で「オルガン」を意味する言葉に由来する名前で何と呼ぶ？","answer":"オルゴール","accept_rule":"カタカナ・ひらがな可。5文字形式では five の読みで判定","explanation":"オランダ語 orgel が語源。日本は世界有数のオルゴール生産国だった。","formats":["five","flip"],"expected_correct_rate":0.68,"five": 2b\"/><line x1=\"335\" y1=\"118\" x2=\"395\" y2=\"118\" stroke=\"#d6a85a\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"335\" cy=\"118\" r=\"8\" fill=\"#c0392b\"/><line x1=\"430\" y1=\"39\" x2=\"430\" y2=\"91\" stroke=\"#d6a85a\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"430\" cy=\"39\" r=\"8\" fill=\"#c0392b\"/><line x1=\"439\" y1=\"100\" x2=\"491\" y2=\"100\" stroke=\"#d6a85a\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"439\" cy=\"100\" r=\"8\" fill=\"#c0392b\"/><line x1=\"500\" y1=\"39\" x2=\"500\" y2=\"91\" stroke=\"#d6a85a\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"500\" cy=\"39\" r=\"8\" fill=\"#c0392b\"/><line x1=\"500\" y1=\"109\" x2=\"500\" y2=\"161\" stroke=\"#d6a85a\" stroke-width=\"8\" stroke-linecap=\"round\"/><circle cx=\"500\" cy=\"109\" r=\"8\" fill=\"#c0392b\"/><\/svg>"},{"id":"rid-113","genre":"riddle","question":"画面の図の中に、三角形は全部でいくつある？ 大きさの違うものも、全部数えてください。","answer":"12","accept_rule":"「12」のみ正解。near形式なら最も近いチーム","explanation":"てっぺんから出る4本の線から2本を選ぶ組み合わせが6通り。底辺が2段あるので6×2＝12個。","formats":["flip","near","image"],"expected_correct_rate":0.55,"image_svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 380\"><rect width=\"400\" height=\"380\" fill=\"#ffffff\"/><polygon points=\"200,30 40,340 340,340\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"6\" stroke-linejoin=\"round\"/><line x1=\"200\" y1=\"30\" x2=\"140.0\" y2=\"340\" stroke=\"#1a1a1a\" stroke-width=\"6\"/><line x1=\"200\" y1=\"30\" x2=\"240.0\" y2=\"340\" stroke=\"#1a1a1a\" stroke-width=\"6\"/><line x1=\"107.1\" y1=\"210\" x2=\"281.3\" y2=\"210\" stroke=\"#1a1a1a\" stroke-width=\"6\"/><\/svg>"},{"id":"rid-114","genre":"riddle","question":"画面は、鏡に映った時計です。本当の時刻は何時？ ちょうどの時刻です。","answer":"8時","accept_rule":"「8時」のみ正解（8時00分、20時も可）","explanation":"鏡では左右が逆になるので、4時に見える針は本当は8時を指している。","formats":["flip","image","buzzer"],"expected_correct_rate":0.65,"image_svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 400\"><rect width=\"400\" height=\"400\" fill=\"#ffffff\"/><g transform=\"translate(400,0) scale(-1,1)\"><circle cx=\"200\" cy=\"200\" r=\"150\" fill=\"#ffffff\" stroke=\"#1a1a1a\" stroke-width=\"8\"/><line x1=\"200.0\" y1=\"58.0\" x2=\"200.0\" y2=\"80.0\" stroke=\"#1a1a1a\" stroke-width=\"6\"/><line x1=\"271.0\" y1=\"77.0\" x2=\"265.0\" y2=\"87.4\" stroke=\"#1a1a1a\" stroke-width=\"3\"/><line x1=\"323.0\" y1=\"129.0\" x2=\"312.6\" y2=\"135.0\" stroke=\"#1a1a1a\" stroke-width=\"3\"/><line x1=\"342.0\" y1=\"200.0\" x2=\"320.0\" y2=\"200.0\" stroke=\"#1a1a1a\" stroke-width=\"6\"/><line x1=\"323.0\" y1=\"271.0\" x2=\"312.6\" y2=\"265.0\" stroke=\"#1a1a1a\" stroke-width=\"3\"/><line x1=\"271.0\" y1=\"323.0\" x2=\"265.0\" y2=\"312.6\" stroke=\"#1a1a1a\" stroke-width=\"3\"/><line x1=\"200.0\" y1=\"342.0\" x2=\"200.0\" y2=\"320.0\" stroke=\"#1a1a1a\" stroke-width=\"6\"/><line x1=\"129.0\" y1=\"323.0\" x2=\"135.0\" y2=\"312.6\" stroke=\"#1a1a1a\" stroke-width=\"3\"/><line x1=\"77.0\" y1=\"271.0\" x2=\"87.4\" y2=\"265.0\" stroke=\"#1a1a1a\" stroke-width=\"3\"/><line x1=\"58.0\" y1=\"200.0\" x2=\"80.0\" y2=\"200.0\" stroke=\"#1a1a1a\" stroke-width=\"6\"/><line x1=\"77.0\" y1=\"129.0\" x2=\"87.4\" y2=\"135.0\" stroke=\"#1a1a1a\" stroke-width=\"3\"/><line x1=\"129.0\" y1=\"77.0\" x2=\"135.0\" y2=\"87.4\" stroke=\"#1a1a1a\" stroke-width=\"3\"/><line x1=\"200\" y1=\"200\" x2=\"126.4\" y2=\"242.5\" stroke=\"#1a1a1a\" stroke-width=\"12\" stroke-linecap=\"round\"/><line x1=\"200\" y1=\"200\" x2=\"200\" y2=\"75\" stroke=\"#1a1a1a\" stroke-width=\"7\" stroke-linecap=\"round\"/><circle cx=\"200\" cy=\"200\" r=\"9\" fill=\"#1a1a1a\"/><\/g><\/svg>"},{"id":"rid-115","genre":"riddle","question":"画面は電卓風の数字です。画面を逆さま（上下180度回転）にすると、ある英単語が読めます。何？","answer":"hello","accept_rule":"「hello」のみ正解（大文字小文字不問）","explanation":"07734 を逆さにすると hELLO。電卓を逆さに読む昔からの遊び。","formats":["flip","image"],"conflicts_with":["rid-601"],"expected_correct_rate":0.65,"image_svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 580 200\"><rect width=\"580\" height=\"200\" rx=\"16\" fill=\"#dfe8d0\" stroke=\"#555555\" stroke-width=\"4\"/><line x1=\"47\" y1=\"30\" x2=\"103\" y2=\"30\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"110\" y1=\"37\" x2=\"110\" y2=\"93\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"110\" y1=\"107\" x2=\"110\" y2=\"163\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"47\" y1=\"170\" x2=\"103\" y2=\"170\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"40\" y1=\"107\" x2=\"40\" y2=\"163\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"40\" y1=\"37\" x2=\"40\" y2=\"93\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"153\" y1=\"30\" x2=\"209\" y2=\"30\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"216\" y1=\"37\" x2=\"216\" y2=\"93\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"216\" y1=\"107\" x2=\"216\" y2=\"163\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"259\" y1=\"30\" x2=\"315\" y2=\"30\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"322\" y1=\"37\" x2=\"322\" y2=\"93\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"322\" y1=\"107\" x2=\"322\" y2=\"163\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"365\" y1=\"30\" x2=\"421\" y2=\"30\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"428\" y1=\"37\" x2=\"428\" y2=\"93\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"365\" y1=\"100\" x2=\"421\" y2=\"100\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"428\" y1=\"107\" x2=\"428\" y2=\"163\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"365\" y1=\"170\" x2=\"421\" y2=\"170\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"464\" y1=\"37\" x2=\"464\" y2=\"93\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"471\" y1=\"100\" x2=\"527\" y2=\"100\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"534\" y1=\"37\" x2=\"534\" y2=\"93\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><line x1=\"534\" y1=\"107\" x2=\"534\" y2=\"163\" stroke=\"#1a1a1a\" stroke-width=\"14\" stroke-linecap=\"round\"/><\/svg>"},{"id":"rid-116","genre":"riddle","question":"アルファベットの大文字「E」を、紙に書いて180度回転させます。あるカタカナに見えます。何？","display":"E　を180度回すと？","answer":"ヨ","accept_rule":"「ヨ」のみ正解","explanation":"Eを逆さにすると横棒3本と右側の縦棒で「ヨ」。","formats":["buzzer","flip"],"conflicts_with":["rid-117","rid-601"],"expected_correct_rate":0.75},{"id":"rid-117","genre":"riddle","question":"英語の「NO」と書いた紙を、180度回転させます。何という英単語になる？","display":"NO　を180度回すと？","answer":"ON","accept_rule":"「ON」のみ正解","explanation":"NもOも180度回しても同じ形。順番が入れ替わって「ON」になる。","formats":["buzzer","flip"],"conflicts_with":["rid-116","rid-601"],"expected_correct_rate":0.75},{"id":"rid-118","genre":"riddle","question":"画面の暗号を解くと、ある動物の名前になります。何？","display":"か２　た３　な４","answer":"きつね","accept_rule":"「きつね」のみ正解","explanation":"五十音表で「か行の2番目」＝き、「た行の3番目」＝つ、「な行の4番目」＝ね。","formats":["flip"],"expected_correct_rate":0.62},{"id":"rid-119","genre":"riddle","question":"画面の暗号を解くと、ある食べ物になります。スマホの文字入力を思い出してください。何？","display":"さ↑　さ←","answer":"すし","accept_rule":"「すし」のみ正解","explanation":"フリック入力は、上にはじくと「う段」、左にはじくと「い段」。「さ↑」＝す、「さ←」＝し。","formats":["flip"],"expected_correct_rate":0.55},{"id":"rid-120","genre":"riddle","question":"画面の暗号を解くと、ある花の名前になります。昔のケータイ（ガラケー）の文字入力を思い出してください。","display":"３　２２２　９","answer":"さくら","accept_rule":"「さくら」のみ正解","explanation":"ガラケーのボタンは2がか行、3がさ行、9がら行。「3」＝さ、「222」＝く、「9」＝ら。","formats":["flip"],"expected_correct_rate":0.55},{"id":"rid-121","genre":"riddle","question":"マラソンで、あなたは2位の人を追い抜きました。今、あなたは何位？","answer":"2位","accept_rule":"「2位」のみ正解","explanation":"2位の人を抜いたら、自分がその2位に入る。1位はまだ前にいる。","formats":["buzzer","flip"],"expected_correct_rate":0.7},{"id":"rid-122","genre":"riddle","question":"赤い家は赤いレンガ、青い家は青いレンガ、黄色い家は黄色いレンガでできています。では、グリーンハウスは何でできている？","answer":"ガラス","accept_rule":"「ガラス」で正解。グリーンハウス＝温室と気づいた「ビニール」も可。「緑のレンガ」は不正解","explanation":"グリーンハウス（greenhouse）は「温室」のこと。緑のレンガではなくガラス張り。","formats":["buzzer","flip"],"expected_correct_rate":0.58},{"id":"rid-123","genre":"riddle","question":"1年のうち、「28日」がある月はいくつ？","display":"「28日」がある月は、いくつ？","answer":"12か月（全部）","accept_rule":"「12」「全部」のいずれかで正解。「1つ（2月）」は不正解","explanation":"2月だけと思いがちだが、どの月にも28日はある。だから12か月全部。","formats":["flip","buzzer"],"expected_correct_rate":0.65},{"id":"rid-124","genre":"riddle","question":"花子さんのお母さんには、子どもが3人います。1人目は「イチコ」、2人目は「ニコ」。3人目の名前は？","answer":"花子","accept_rule":"「花子」のみ正解。「サンコ」は不正解","explanation":"問題の最初に名前が出ている。3人目は花子さん本人。","formats":["buzzer","flip"],"expected_correct_rate":0.68},{"id":"rid-125","genre":"riddle","question":"田中さんには娘が4人います。娘たちには、それぞれお兄さんが1人ずついます。田中さんの子どもは全部で何人？","display":"娘が4人\nそれぞれにお兄さんが1人\n子どもは全部で？","answer":"5人","accept_rule":"「5人」のみ正解","explanation":"4人の娘のお兄さんは全員同じ1人。4＋1＝5人。","formats":["flip"],"expected_correct_rate":0.65},{"id":"rid-126","genre":"riddle","question":"あなたはバスの運転手です。最初の停留所で5人乗り、次で3人降りて2人乗り、その次で4人降りました。さて、運転手は何歳？","display":"あなたはバスの運転手\n＋5人 → −3人＋2人 → −4人\n運転手は何歳？","answer":"自分の年齢","accept_rule":"「自分（あなた）の年齢」が言えていれば正解。チームの代表の実年齢を書いていても正解","explanation":"運転手は「あなた」。計算に気を取られると最初の一文を忘れる。","formats":["flip"],"expected_correct_rate":0.58},{"id":"rid-127","genre":"riddle","question":"丸いホールケーキを、包丁を3回入れるだけで、同じ大きさ8切れに分けたい。どう切る？","display":"ケーキを3回切って\n8等分にするには？","answer":"十字に2回切ってから、横（水平）に1回切る","accept_rule":"「横（水平）に切って厚みを半分にする」発想が出ていれば正解。切った片を重ねて切る方法（3回で8等分）も別解として正解","explanation":"上から十字に切って4つにし、最後に厚みを半分にするように横から1回。これで8切れ。","formats":["flip"],"expected_correct_rate":0.62},{"id":"rid-128","genre":"riddle","question":"紙を半分に折り、さらにもう一度半分に折ります。重なった紙の真ん中あたりに穴を1つ開けて広げると、穴はいくつ？","display":"半分に折る → また半分に折る\n真ん中あたりに穴を1つ開けて広げると？","answer":"4つ","accept_rule":"「4」のみ正解","explanation":"2回折ると紙は4枚重ね。1回の穴が4枚全部を貫くので、広げると4つ。","formats":["flip","buzzer"],"expected_correct_rate":0.68},{"id":"rid-129","genre":"riddle","question":"10本のロウソクに火をつけました。風が吹いて2本だけ消えました。翌朝、残っているロウソクは何本？","display":"10本に火 → 2本だけ消えた\n翌朝、残っているのは？","answer":"2本","accept_rule":"「2本」のみ正解。「8本」は不正解","explanation":"火がついたままの8本は燃え尽きてなくなる。残るのは消えた2本だけ。","formats":["flip"],"expected_correct_rate":0.55},{"id":"rid-130","genre":"riddle","question":"画面の5つの言葉は、ある決まりでこの順番に並んでいます。どんな決まり？","display":"いちご　にんじん　さんま　しか　ごま","answer":"頭に1〜5の数字が隠れている","accept_rule":"「数字（1、2、3、4、5）が隠れている」という趣旨が言えていれば正解","explanation":"いち・ご、に・んじん、さん・ま、し・か、ご・ま。言葉の頭に1から5が順番に隠れている。","formats":["flip"],"expected_correct_rate":0.65},{"id":"his-101","genre":"history","question":"3世紀、邪馬台国の女王・卑弥呼が使いを送り、金印や銅鏡を授かった中国の王朝は何？","answer":"魏","accept_rule":"「魏」で正解。「三国志の魏」など補足付きも可","explanation":"だから史料の名前は「魏志倭人伝」。239年に「親魏倭王」の称号と金印、銅鏡100枚を贈られた。","formats":["buzzer","flip"],"expected_correct_rate":0.65},{"id":"his-102","genre":"history","question":"1925年、納税額による制限がなくなった「普通選挙法」。選挙権が与えられたのは「満何歳以上」の男子だった？","answer":"満25歳以上","accept_rule":"「25歳」で正解","explanation":"女性はまだ対象外。同じ年に治安維持法も成立したのがテストの定番。","formats":["flip","buzzer"],"expected_correct_rate":0.5},{"id":"his-103","genre":"history","question":"冠位十二階や十七条の憲法を定めた聖徳太子。今の教科書で「聖徳太子」の名と並べて書かれている、本名にもとづく呼び名は何？","answer":"厩戸皇子（うまやどのおうじ）","accept_rule":"「厩戸皇子」「厩戸王」どちらも正解。「うまやど」が出れば可","explanation":"「聖徳太子」は死後の呼び名。一時は教科書から消える案も出たが、今は併記が主流。","formats":["flip","buzzer"],"expected_correct_rate":0.55},{"id":"his-104","genre":"history","question":"603年に定められた「冠位十二階」。位ごとに冠の色が決められていましたが、最も高い位「大徳」の色は次のうちどれ？","answer":"紫","accept_rule":"「紫」で正解","explanation":"通説では紫は最も高貴な色で、以下青・赤・黄・白・黒の順（日本書紀に色の明記はなく推定）。","formats":["choice4","flip"],"choices":["紫","赤","金","青"],"expected_correct_rate":0.65},{"id":"his-105","genre":"history","question":"645年、中大兄皇子（なかのおおえのおうじ）とともに蘇我入鹿を倒し、大化の改新を進めた人物は誰？","answer":"中臣鎌足（なかとみのかまたり）","accept_rule":"「中臣鎌足」「藤原鎌足」どちらも正解。「鎌足」のみでも可","explanation":"死の直前に「藤原」の姓を賜り、藤原氏の祖になった。","formats":["buzzer","flip"],"expected_correct_rate":0.72},{"id":"his-106","genre":"history","question":"「鳴くよウグイス」794年、都を平安京に移した天皇は次のうち誰？","answer":"桓武天皇","accept_rule":"「桓武」で正解","explanation":"平城京を作った「なんと見事な」710年は元明天皇。坂上田村麻呂を征夷大将軍にしたのも桓武天皇。","formats":["choice4","flip"],"choices":["桓武天皇","聖武天皇","天武天皇","推古天皇"],"expected_correct_rate":0.68},{"id":"his-107","genre":"history","question":"奈良時代、仏教の力で国を守ろうと考えた聖武天皇が、東大寺の大仏とあわせて「国ごと」に建てさせた寺を何という？","answer":"国分寺","accept_rule":"「国分寺」で正解。「国分尼寺」も可","explanation":"東京の「国分寺市」や各地の「国分」という地名はここから。","formats":["buzzer","flip"],"expected_correct_rate":0.58},{"id":"his-108","genre":"history","question":"奈良時代、5回の渡航失敗と失明を乗り越えて来日し、唐招提寺（とうしょうだいじ）を開いた唐の僧は誰？","answer":"鑑真（がんじん）","accept_rule":"「がんじん」で正解","explanation":"6回目でようやく成功、753年に来日。正しい仏教の戒律を日本に伝えた。","formats":["buzzer","flip"],"expected_correct_rate":0.7},{"id":"his-109","genre":"history","question":"「この世をば わが世とぞ思ふ 望月の…」。娘3人を天皇のきさきにして摂関政治の全盛期を築き、この歌を詠んだ人物は誰？","answer":"藤原道長","accept_rule":"「道長」で正解","explanation":"1018年、三女・威子が中宮になった祝宴で詠んだ。息子の頼通は平等院鳳凰堂を建てた人。","formats":["buzzer","flip"],"expected_correct_rate":0.68},{"id":"his-110","genre":"history","question":"1167年、武士として初めて太政大臣（だいじょうだいじん）になり、宋との貿易にも力を入れた人物は誰？","answer":"平清盛","accept_rule":"「清盛」で正解","explanation":"日宋貿易のために兵庫の港（大輪田泊）を整備。娘を天皇のきさきにするやり方は藤原氏と同じ。","formats":["buzzer","flip"],"expected_correct_rate":0.72},{"id":"his-111","genre":"history","question":"1274年と1281年の2度にわたる元寇（げんこう）。このとき元軍に立ち向かった鎌倉幕府の執権（しっけん）は誰？","answer":"北条時宗","accept_rule":"「時宗（ときむね）」で正解","explanation":"文永の役・弘安の役。御家人への恩賞が不十分で幕府が弱る原因に。","formats":["buzzer","flip"],"expected_correct_rate":0.55},{"id":"his-112","genre":"history","question":"1221年、鎌倉幕府を倒そうと兵を挙げたが敗れ、隠岐（おき）に流された上皇は誰？","answer":"後鳥羽上皇","accept_rule":"「後鳥羽」で正解","explanation":"承久の乱。このあと幕府は京都に六波羅探題を置いて朝廷を監視するようになった。","formats":["buzzer","flip"],"expected_correct_rate":0.52},{"id":"his-113","genre":"history","question":"鎌倉幕府を滅ぼしたあと、天皇中心の政治「建武（けんむ）の新政」を始めたが、足利尊氏と対立して吉野へ逃れた天皇は誰？","answer":"後醍醐天皇","accept_rule":"「後醍醐（ごだいご）」で正解","explanation":"吉野の南朝と京都の北朝が並び立つ「南北朝時代」の始まり。","formats":["buzzer","flip"],"expected_correct_rate":0.65},{"id":"his-114","genre":"history","question":"1467年に始まった応仁の乱。そのあとつぎ争いが原因の一つになった、銀閣を建てたことでも知られる室町幕府8代将軍は誰？","answer":"足利義政","accept_rule":"「義政」で正解","explanation":"弟の義視と息子の義尚の争いに細川勝元・山名宗全が絡み、11年続いた。金閣の義満は3代。","formats":["buzzer","flip"],"expected_correct_rate":0.65},{"id":"his-115","genre":"history","question":"1560年、桶狭間（おけはざま）の戦いで織田信長に討たれた、駿河（するが）の戦国大名は誰？","answer":"今川義元","accept_rule":"「今川」のみでも正解","explanation":"このとき今川家の人質だったのが若き日の徳川家康（松平元康）。","formats":["buzzer","flip"],"expected_correct_rate":0.68},{"id":"his-116","genre":"history","question":"豊臣秀吉が、一揆を防ぎ武士と農民の区別をはっきりさせるため、農民から刀や鉄砲を取り上げた政策を何という？","answer":"刀狩","accept_rule":"「刀狩（令）」で正解","explanation":"1588年。名目は「大仏を作る釘にする」。太閤検地とセットで兵農分離を進めた。","formats":["buzzer","flip"],"expected_correct_rate":0.72},{"id":"his-117","genre":"history","question":"大名が1年ごとに江戸と領地を行き来する「参勤交代」。1635年にこれを制度として定めた徳川将軍は誰？","answer":"徳川家光","accept_rule":"「家光」で正解","explanation":"3代将軍。武家諸法度に書き加えた。鎖国を完成させたのも家光の時代。","formats":["buzzer","flip"],"expected_correct_rate":0.58},{"id":"his-118","genre":"history","question":"1637年、キリシタンへの弾圧と重い年貢に反発して九州で起きた大規模な一揆。総大将に担がれた16歳の少年は誰？","answer":"天草四郎","accept_rule":"「天草四郎」で正解。本名「益田時貞」も可","explanation":"島原・天草一揆。原城にこもって約3か月戦ったが敗北。この後、幕府はポルトガル船の来航を禁止した。","formats":["buzzer","flip"],"expected_correct_rate":0.65},{"id":"his-119","genre":"history","question":"江戸時代の化政文化。浮世絵の風景画「東海道五十三次」を描いた絵師は次のうち誰？","answer":"歌川広重","accept_rule":"「広重」で正解。「安藤広重」も可","explanation":"「富嶽三十六景」の北斎と混同しがち。広重の雨や雪の表現はゴッホも模写した。","formats":["choice4","flip"],"choices":["歌川広重","葛飾北斎","喜多川歌麿","東洲斎写楽"],"expected_correct_rate":0.58},{"id":"his-120","genre":"history","question":"1837年、天保のききんで苦しむ人々を救おうと、大坂町奉行所の元役人が起こした反乱を何という？","answer":"大塩平八郎の乱","accept_rule":"「大塩平八郎」の名前が出れば正解","explanation":"幕府の元役人が反乱を起こしたこと自体が衝撃で、天保の改革のきっかけの一つに。","formats":["buzzer","flip"],"expected_correct_rate":0.55},{"id":"his-121","genre":"history","question":"日米修好通商条約を結び、安政の大獄で反対派を処罰した大老・井伊直弼。1860年、彼が暗殺された事件を何という？","answer":"桜田門外の変","accept_rule":"「桜田門外」が出れば正解","explanation":"江戸城の桜田門の外で水戸藩などの浪士に襲われた。幕府の権威が大きく揺らぐきっかけに。","formats":["buzzer","flip"],"expected_correct_rate":0.65},{"id":"his-122","genre":"history","question":"幕末から明治初期の次の出来事を、起きた順（古い順）に並べ替えてください。","answer":"大政奉還 → 版籍奉還 → 廃藩置県 → 西南戦争","accept_rule":"4つすべて正しい順で正解","explanation":"大政奉還1867年、版籍奉還1869年、廃藩置県1871年、西南戦争1877年。「版籍」が先で「廃藩」が後。","formats":["order"],"expected_correct_rate":0.55},{"id":"his-123","genre":"history","question":"1874年に民撰議院設立の建白書を提出して自由民権運動を始め、「板垣死すとも自由は死せず」の言葉でも知られる人物は誰？","answer":"板垣退助","accept_rule":"「板垣」で正解","explanation":"1881年に自由党を結成。旧100円札の肖像でもあった。","formats":["buzzer","flip"],"expected_correct_rate":0.75},{"id":"his-124","genre":"history","question":"日清戦争の講和条約は「下関条約」。では1905年、アメリカの仲介で結ばれた日露戦争の講和条約は何？","answer":"ポーツマス条約","accept_rule":"「ポーツマス」で正解","explanation":"仲介したのはセオドア・ルーズベルト大統領。賠償金が取れず、国民の不満から日比谷焼き打ち事件が起きた。","formats":["buzzer","flip"],"expected_correct_rate":0.58},{"id":"his-125","genre":"history","question":"明治から昭和にかけての次の戦争・事変を、始まった順（古い順）に並べ替えてください。","answer":"日清戦争 → 日露戦争 → 第一次世界大戦 → 満州事変","accept_rule":"4つすべて正しい順で正解","explanation":"日清1894年、日露1904年、第一次世界大戦1914年、満州事変1931年。前の3つは10年おき。","formats":["order"],"expected_correct_rate":0.65},{"id":"sci-101","genre":"science_numbers","question":"てこには3つの点があります。「支点」「力点」と、あと1つは何？","answer":"作用点","accept_rule":"「作用点」のみ正解","explanation":"力点で加えた力が、支点を通して作用点にはたらく。はさみや栓抜きもてこの仲間。","formats":["buzzer","flip"],"expected_correct_rate":0.67},{"id":"sci-102","genre":"science_numbers","question":"抵抗が2Ω（オーム）の電熱線に、6Vの電圧をかけました。流れる電流は何A（アンペア）？","answer":"3A","accept_rule":"数値「3」が合っていれば正解（単位の有無は不問）","explanation":"オームの法則「電圧＝電流×抵抗」。6÷2＝3A。","formats":["buzzer","flip"],"expected_correct_rate":0.57},{"id":"sci-103","genre":"science_numbers","question":"光が空気から水の中へ斜めに進むとき、境目で進む向きが折れ曲がります。この現象を何という？","answer":"屈折","accept_rule":"「屈折」のみ正解。「反射」は不可","explanation":"水に入れたストローが曲がって見えるのも屈折のせい。","formats":["buzzer","flip"],"expected_correct_rate":0.67},{"id":"sci-104","genre":"science_numbers","question":"音の「高さ」は振動数（1秒間に振動する回数）で決まります。では、音の「大きさ」を決めるのは何？","answer":"振幅","accept_rule":"「振幅」のみ正解。「振れ幅」も可","explanation":"振幅が大きいほど大きい音。オシロスコープの波の高さが振幅。","formats":["buzzer","flip","choice4"],"choices":["振幅","波長","音速","周期"],"expected_correct_rate":0.47},{"id":"sci-105","genre":"science_numbers","question":"豆電球2個を電池につなぎました。1個を外しても、もう1個が光り続けるのは、直列つなぎ・並列つなぎのどっち？","answer":"並列つなぎ","accept_rule":"「並列」が入っていれば正解","explanation":"並列は電気の通り道が分かれているので、片方が切れても影響しない。家庭のコンセントも並列。","formats":["buzzer","flip","choice2"],"choices":["直列つなぎ","並列つなぎ"],"expected_correct_rate":0.64},{"id":"sci-106","genre":"science_numbers","question":"水はH2O、二酸化炭素はCO2。では、食塩（塩化ナトリウム）の化学式は？","answer":"NaCl","accept_rule":"「NaCl」のみ正解。大文字・小文字の区別は不問","explanation":"Naはナトリウム、Clは塩素。ナトリウムイオンと塩化物イオンが結びついた物質。","formats":["buzzer","flip"],"conflicts_with":["sci-003"],"expected_correct_rate":0.62},{"id":"sci-107","genre":"science_numbers","question":"理科の実験でおなじみ。石灰水に通すと、石灰水が白くにごる気体は何？","answer":"二酸化炭素","accept_rule":"「二酸化炭素」「CO2」「炭酸ガス」いずれも正解","explanation":"二酸化炭素と水酸化カルシウムが反応して、水に溶けにくい炭酸カルシウムができるため白くにごる。","formats":["buzzer","flip"],"expected_correct_rate":0.67},{"id":"sci-108","genre":"science_numbers","question":"ドライアイスのように、固体が液体にならず、直接気体に変わる状態変化を何という？","answer":"昇華","accept_rule":"「昇華」のみ正解。「蒸発」「気化」は不可","explanation":"融解・凝固・蒸発などと並ぶ状態変化の名前。防虫剤のナフタレンも昇華する。","formats":["buzzer","flip","choice4"],"choices":["融解","蒸発","昇華","凝固"],"expected_correct_rate":0.62},{"id":"sci-109","genre":"science_numbers","question":"無色透明だが、アルカリ性の水溶液に入れると赤色に変わる指示薬は何？","answer":"フェノールフタレイン溶液","accept_rule":"「フェノールフタレイン」が言えれば正解","explanation":"酸性・中性では無色のまま。中和実験で、アルカリ性かどうかを見分けるのに使う。","formats":["buzzer","flip"],"conflicts_with":["sci-033"],"expected_correct_rate":0.47},{"id":"sci-110","genre":"science_numbers","question":"試験管に集めたこの気体に、火のついたマッチを近づけると「ポン」と音を立てて燃えます。この気体は何？","answer":"水素","accept_rule":"「水素」「H2」いずれも正解","explanation":"水素が空気中の酸素と結びついて水になる反応。亜鉛にうすい塩酸を加えると発生する。","formats":["buzzer","flip"],"expected_correct_rate":0.62},{"id":"sci-111","genre":"science_numbers","question":"金の元素記号は「Au」。では、銀の元素記号は何？","answer":"Ag","accept_rule":"「Ag」のみ正解。大文字・小文字の区別は不問","explanation":"ラテン語の「argentum（アルゲントゥム）」から。南米のアルゼンチンも同じ語源。","formats":["buzzer","flip"],"expected_correct_rate":0.57},{"id":"sci-112","genre":"science_numbers","question":"酸性の水溶液とアルカリ性の水溶液を混ぜる「中和」。このとき、水と、もう1つできる物質を総称して何という？","answer":"塩（えん）","accept_rule":"漢字「塩」または「えん」で正解。「しお」と答えても字が同じなので正解","explanation":"塩酸と水酸化ナトリウム水溶液を中和すると、塩として塩化ナトリウム（食塩）ができる。","formats":["buzzer","flip"],"expected_correct_rate":0.5},{"id":"sci-113","genre":"science_numbers","question":"だ液に含まれていて、ご飯などのデンプンを分解する消化酵素の名前は何？","answer":"アミラーゼ","accept_rule":"「アミラーゼ」で正解。「プチアリン」も可","explanation":"デンプンを麦芽糖などに分解する。ご飯をかみ続けると甘くなるのはこのため。","formats":["buzzer","flip"],"expected_correct_rate":0.57},{"id":"sci-114","genre":"science_numbers","question":"植物の葉の表面にある、水蒸気や二酸化炭素などの気体が出入りする小さな穴を何という？","answer":"気孔","accept_rule":"「気孔」のみ正解","explanation":"三日月形の「孔辺細胞」2つに囲まれていて、開いたり閉じたりする。葉の裏側に多い。","formats":["buzzer","flip"],"expected_correct_rate":0.62},{"id":"sci-115","genre":"science_numbers","question":"植物の細胞にはあって、動物の細胞にはないもの。細胞膜のさらに外側を囲む、丈夫な仕切りを何という？","answer":"細胞壁","accept_rule":"「細胞壁」のみ正解。「細胞膜」は不可","explanation":"ほかに葉緑体・発達した液胞も植物の細胞の特徴。細胞壁の主成分はセルロース。","formats":["buzzer","flip"],"expected_correct_rate":0.62},{"id":"sci-116","genre":"science_numbers","question":"エンドウ（エンドウ豆）を使った実験で、遺伝の法則を発見したオーストリアの修道士は誰？","answer":"メンデル","accept_rule":"「メンデル」で正解","explanation":"1865年に発表。子に現れる形質の決まり方や「分離の法則」で知られる。","formats":["buzzer","flip"],"expected_correct_rate":0.67},{"id":"sci-117","genre":"science_numbers","question":"肺の中にたくさんある、酸素と二酸化炭素を交換する小さな袋。何という？","answer":"肺胞","accept_rule":"「肺胞」のみ正解","explanation":"数は数億個といわれ、表面積を大きくして効率よくガス交換をしている。","formats":["buzzer","flip"],"expected_correct_rate":0.57},{"id":"sci-118","genre":"science_numbers","question":"遺伝子の本体である物質「DNA」。これは、ある物質の名前の略です。正式には何という物質？","answer":"デオキシリボ核酸","accept_rule":"「デオキシリボ核酸」のみ正解。「核酸」だけでは不可","explanation":"Deoxyribonucleic acid の略。二重らせん構造をしている。","formats":["buzzer","flip"],"expected_correct_rate":0.42},{"id":"sci-119","genre":"science_numbers","question":"イモリは両生類の仲間。では、名前のよく似ている「ヤモリ」はセキツイ動物の5つのグループのうち何類？","answer":"ハ虫類","accept_rule":"「ハ虫類（爬虫類）」で正解","explanation":"ヤモリはトカゲの仲間で、体がうろこに覆われている。イモリは水辺にすみ皮ふが湿っている。","formats":["buzzer","flip","choice4"],"choices":["ハ虫類","両生類","ホ乳類","魚類"],"expected_correct_rate":0.6},{"id":"sci-120","genre":"science_numbers","question":"地震が発生した地下の場所を「震源」といいます。では、震源の真上にあたる地表の地点を何という？","answer":"震央","accept_rule":"「震央」のみ正解","explanation":"ニュースの地図で「×」印がついているのが震央。震源から震央までの距離が震源の深さ。","formats":["buzzer","flip"],"expected_correct_rate":0.62},{"id":"sci-121","genre":"science_numbers","question":"冷たい空気が暖かい空気の下にもぐり込み、押し上げながら進む前線。通過後に気温が急に下がるこの前線は何？","answer":"寒冷前線","accept_rule":"「寒冷前線」のみ正解","explanation":"積乱雲ができて短時間に強い雨が降る。天気図では青い三角の記号。","formats":["buzzer","flip","choice4"],"choices":["温暖前線","寒冷前線","停滞前線","閉塞前線"],"expected_correct_rate":0.6},{"id":"sci-122","genre":"science_numbers","question":"画面に出ている天気図の記号。これは、どんな天気を表している？","answer":"くもり","accept_rule":"「くもり」で正解","explanation":"◎がくもり。○は快晴、○に縦線で晴れ、●が雨。","formats":["buzzer","flip","image"],"expected_correct_rate":0.62,"image_svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\"><circle cx=\"100\" cy=\"100\" r=\"80\" fill=\"#ffffff\" stroke=\"#222222\" stroke-width=\"10\"/><circle cx=\"100\" cy=\"100\" r=\"40\" fill=\"#ffffff\" stroke=\"#222222\" stroke-width=\"10\"/><\/svg>"},{"id":"sci-123","genre":"science_numbers","question":"太陽の表面にあり、周りより温度が低いために黒く見える部分を何という？","answer":"黒点","accept_rule":"「黒点」のみ正解","explanation":"周りが約6000℃なのに対し、黒点は約4000℃。約11年周期で数が増減する。","formats":["buzzer","flip"],"expected_correct_rate":0.6},{"id":"sci-124","genre":"science_numbers","question":"北の空の星は、北極星を中心に回って見えます。地球の自転により、星は1時間におよそ何度動く？","answer":"15度","accept_rule":"「15度」で正解","explanation":"1日（24時間）で360度回るので、360÷24＝15度。","formats":["buzzer","flip","choice4"],"choices":["5度","15度","30度","45度"],"expected_correct_rate":0.44},{"id":"sci-125","genre":"science_numbers","question":"地層をつくる「れき」「砂」「泥」。川から海へ運ばれたとき、河口からいちばん遠い沖まで運ばれて積もるのは？","answer":"泥","accept_rule":"「泥」のみ正解","explanation":"粒が小さいものほど遠くまで運ばれる。れきは河口の近く、泥は沖合に堆積する。","formats":["buzzer","flip"],"expected_correct_rate":0.57},{"id":"his-201","genre":"history","question":"四大文明のひとつメソポタミア文明。粘土板に葦（あし）の先を押しつけて記した、この文明の文字を何という？","answer":"くさび形文字","accept_rule":"「くさび形」「楔形」どちらの表記でも正解。「くさび文字」も可","explanation":"シュメール人が発明。粘土板に押しつけた跡がくさびの形に見えることから。","formats":["buzzer","flip"],"expected_correct_rate":0.65},{"id":"his-202","genre":"history","question":"古代中国の殷（いん）王朝で、占いの結果を刻んで記録した、漢字のもとになった文字を何という？","answer":"甲骨文字","accept_rule":"「甲骨文字」で正解。「甲骨文」も可","explanation":"亀の甲羅や牛の骨に刻んだので「甲骨」。19世紀末、漢方薬の材料「竜骨」から偶然見つかった。","formats":["buzzer","flip"],"expected_correct_rate":0.63},{"id":"his-203","genre":"history","question":"インダス文明を代表する都市遺跡。現地の言葉で「死者の丘」という意味の名前を持つ、パキスタンにある世界遺産は？","answer":"モヘンジョ・ダロ","accept_rule":"「モヘンジョダロ」など表記ゆれは正解","explanation":"レンガ造りの整然とした街路や排水設備、公衆浴場跡が残る。もう一つの代表遺跡はハラッパー。","formats":["buzzer","flip"],"expected_correct_rate":0.55},{"id":"his-204","genre":"history","question":"中国を初めて統一した秦の始皇帝。その墓のそばから出土した、等身大の兵士や馬の焼き物の像を何という？","answer":"兵馬俑","accept_rule":"「兵馬俑」で正解。ひらがな可","explanation":"1974年、井戸を掘っていた農民が偶然発見。顔は一体一体違うと言われる。","formats":["buzzer","flip"],"expected_correct_rate":0.7},{"id":"his-205","genre":"history","question":"古代ギリシャの都市国家アテネ。その中心の丘「アクロポリス」に建ち、守護神アテナをまつった神殿は？","answer":"パルテノン神殿","accept_rule":"「パルテノン」のみでも正解","explanation":"紀元前5世紀の建築。17世紀には火薬庫として使われ爆発で大破した。","formats":["buzzer","flip"],"expected_correct_rate":0.7},{"id":"his-206","genre":"history","question":"古代ローマの英雄カエサル。「賽（さい）は投げられた」と言って軍とともに渡り、内戦に踏み切ったとされる川の名前は？","answer":"ルビコン川","accept_rule":"「ルビコン」で正解","explanation":"紀元前49年。軍を率いて越えてはならない境界の川だった。「ルビコンを渡る」は後戻りできない決断の意味に。","formats":["buzzer","flip"],"expected_correct_rate":0.65},{"id":"his-207","genre":"history","question":"西暦79年、ベスビオ火山の噴火で火山灰に埋もれ、18世紀に発掘されて当時の暮らしがそのまま見つか e":"history","question":"宗教改革に対抗してカトリック側が海外布教を進めた修道会。日本にキリスト教を伝えたザビエルも創立メンバーだった、この会は？","answer":"イエズス会","accept_rule":"「イエズス会」で正解","explanation":"1534年、ロヨラら7人がパリで結成。上智大学はイエズス会が設立した大学。","formats":["buzzer","flip"],"expected_correct_rate":0.65},{"id":"his-215","genre":"history","question":"コロンブスが到達した土地を「アジアではなく新大陸だ」と主張し、その名前が「アメリカ」の由来になったイタリアの探検家は誰？","answer":"アメリゴ・ベスプッチ","accept_rule":"「アメリゴ」または「ベスプッチ」どちらか一方でも正解","explanation":"1507年の世界地図で、アメリゴの名を女性形にした「アメリカ」が初めて使われた。","formats":["buzzer","flip"],"expected_correct_rate":0.55},{"id":"his-216","genre":"history","question":"大航海時代、1498年にアフリカ南端の喜望峰をまわってインドに到達し、ヨーロッパとインドを結ぶ航路を開いたポルトガルの航海者は誰？","answer":"バスコ・ダ・ガマ","accept_rule":"「バスコ・ダ・ガマ」「ガマ」で正解。コロンブス・マゼランは不正解","explanation":"到着地はインド西岸のカリカット。これでポルトガルは香辛料貿易で大もうけした。","formats":["buzzer","flip"],"expected_correct_rate":0.65},{"id":"his-217","genre":"history","question":"マゼランの艦隊は史上初の世界一周を達成しましたが、マゼラン本人は航海の途中で現地の戦いで死亡。その場所は現在のどこの国？","answer":"フィリピン","accept_rule":"「フィリピン」で正解。「セブ島」「マクタン島」と答えた場合も正解","explanation":"1521年、セブ島近くのマクタン島で戦死。生き残った部下が1522年にスペインへ帰り着いた。","formats":["buzzer","flip"],"expected_correct_rate":0.55},{"id":"his-218","genre":"history","question":"17世紀イギリスのピューリタン革命（清教徒革命）。国王チャールズ1世を処刑し、その後独裁政治を行った指導者は誰？","answer":"クロムウェル","accept_rule":"「クロムウェル」で正解","explanation":"1649年に国王を処刑し共和政に。しかし死後、王政が復活。クロムウェルの遺体は掘り出されて「処刑」された。","formats":["buzzer","flip"],"expected_correct_rate":0.5},{"id":"his-219","genre":"history","question":"1688〜89年のイギリス名誉革命。議会が新しい国王を迎える条件として承認させ、「王は議会の同意なく法を停止できない」などを定めた文書は？","answer":"権利章典","accept_rule":"「権利章典」「権利の章典」で正解","explanation":"マグナ・カルタは1215年、権利の請願は1628年、人権宣言はフランス革命（1789年）。","formats":["choice4","flip"],"choices":["権利章典","マグナ・カルタ","権利の請願","人権宣言"],"expected_correct_rate":0.58},{"id":"his-220","genre":"history","question":"南北戦争中の1863年、リンカン大統領が「人民の、人民による、人民のための政治」と演説した激戦地の町は次のうちどこ？","answer":"ゲティスバーグ","accept_rule":"「ゲティスバーグ」で正解","explanation":"ペンシルベニア州の町。演説は約2分、わずか272語ほどの短さだった。","formats":["choice4","flip"],"choices":["ゲティスバーグ","ワシントン","フィラデルフィア","ボストン"],"expected_correct_rate":0.55},{"id":"his-221","genre":"history","question":"「目には目を、歯には歯を」の一節で知られる、紀元前18世紀ごろメソポタミアのバビロニア王国で定められた法典は？","answer":"ハンムラビ法典","accept_rule":"「ハンムラビ法典」「ハムラビ法典」で正解。王名「ハンムラビ」のみでも可","explanation":"刻まれた石柱はパリのルーブル美術館にある。やり返せではなく「やり過ぎるな」という復讐の制限の意味。","formats":["buzzer","flip"],"expected_correct_rate":0.68},{"id":"his-222","genre":"history","question":"19世紀、「鉄血宰相」と呼ばれ、「鉄と血」すなわち軍備によってドイツ統一を成し遂げたプロイセンの首相は誰？","answer":"ビスマルク","accept_rule":"「ビスマルク」で正解","explanation":"1871年にドイツ帝国が成立。岩倉使節団（伊藤博文も副使）はベルリンでビスマルクと会見している。","formats":["buzzer","flip"],"expected_correct_rate":0.55},{"id":"his-223","genre":"history","question":"1919年、第一次世界大戦の講和条約が結ばれたパリ郊外の宮殿。ルイ14世が建てた豪華な「鏡の間」で調印されたこの宮殿は？","answer":"ヴェルサイユ宮殿","accept_rule":"「ベルサイユ」「ヴェルサイユ」どちらの表記でも正解","explanation":"ドイツにとっては屈辱の場所。1871年にドイツ帝国の成立を宣言したのも同じ「鏡の間」だった。","formats":["buzzer","flip"],"expected_correct_rate":0.65},{"id":"his-224","genre":"history","question":"次のヨーロッパ史の出来事を、始まった順（古い順）に並べ替えてください。","answer":"十字軍の開始 → ルネサンス → 宗教改革 → 産業革命","accept_rule":"4つの順番がすべて合っていれば正解","explanation":"十字軍は1096年、ルネサンスは14世紀イタリアから、宗教改革は1517年、産業革命は18世紀後半のイギリス。","formats":["order"],"conflicts_with":["his-524"],"expected_correct_rate":0.58},{"id":"his-225","genre":"history","question":"次の20世紀前半の出来事を、起きた順（古い順）に並べ替えてください。","answer":"第一次世界大戦の開始 → ロシア革命 → 世界恐慌 → 第二次世界大戦の開始","accept_rule":"4つの順番がすべて合っていれば正解","explanation":"第一次世界大戦1914年、ロシア革命1917年、世界恐慌1929年、第二次世界大戦1939年。","formats":["order"],"expected_correct_rate":0.65},{"id":"spi-001","genre":"spi","question":"A〜Eの5人が徒競走をした。「AはBより速い」「CはAより速い」「EはBより遅い」「DはEより遅い」。3位は誰？","display":"AはBより速い\nCはAより速い\nEはBより遅い\nDはEより遅い\n\n3位は？","answer":"B","accept_rule":"「B」のみ正解","explanation":"速い順に C→A→B→E→D。4つの条件をつなげると一列に決まる。","formats":["flip"],"expected_correct_rate":0.7},{"id":"spi-002","genre":"spi","question":"A〜Eの5人が横一列に並んでいる。「Bは左端」「Eは右端」「AはCのすぐ右隣」「DはBの隣ではない」。真ん中にいるのは誰？","display":"Bは左端\nEは右端\nAはCのすぐ右隣\nDはBの隣ではない\n\n真ん中は？","answer":"A","accept_rule":"「A」のみ正解","explanation":"左から B・C・A・D・E。 演じた俳優は誰？","answer":"二宮和也","accept_rule":"姓のみ可","explanation":"監督・脚本は川村元気。原作ゲームは2023年に個人開発者KOTAKE CREATEが発売した。","formats":["buzzer","flip"],"valid_until":"2028-12-31","expected_correct_rate":0.48},{"id":"ent-601","genre":"entertainment","question":"ジブリ映画「となりのトトロ」の姉妹、サツキとメイ。2人の名前に共通する、ある「月」の意味とは、何月？","answer":"5月","accept_rule":"「5月」で正解。「皐月とMay」など根拠を添えた答えも可","explanation":"サツキは旧暦5月の「皐月（さつき）」、メイは英語の「May」。企画当初は主人公が1人だった名残とされる。","formats":["buzzer","flip"],"expected_correct_rate":0.6},{"id":"ent-602","genre":"entertainment","question":"1995年発売、アニメ「新世紀エヴァンゲリオン」のオープニング曲で、今もカラオケ定番の「残酷な天使のテーゼ」。歌っている女性歌手は誰？","answer":"高橋洋子","accept_rule":"フルネームで正解。「高橋」のみは不可（姓だけでは特定しにくいため）","explanation":"1995年10月25日発売。作詞は及川眠子。オリコン週間カラオケランキングでは2026年5月に通算1000週ランクインを達成。","formats":["buzzer","flip"],"expected_correct_rate":0.57},{"id":"ent-603","genre":"entertainment","question":"2006年の月9ドラマ「のだめカンタービレ」。上野樹里（うえのじゅり）演じる「のだめ」の相手役、指揮者を目指すエリート音大生・千秋真一（ちあきしんいち）を演じた俳優は誰？","answer":"玉木宏","accept_rule":"「玉木」のみでも可","explanation":"2006年10〜12月にフジテレビ系で放送。2008年には特別編「新春スペシャル in ヨーロッパ」も。","formats":["buzzer","flip","choice4"],"choices":["玉木宏","瑛太","小出恵介","竹中直人"],"expected_correct_rate":0.6},{"id":"ent-604","genre":"entertainment","question":"2001年にナムコがゲームセンターで稼働させた音楽ゲーム「太鼓の達人」。顔のついた赤い太鼓のメインキャラクター、その名前は？","answer":"和田どん","accept_rule":"「和田どん」正解。愛称「どんちゃん」も可","explanation":"フルネームは「和田どん」。青い太鼓は双子の弟「和田かつ」。北陸の太鼓工房で作られた太鼓に魂が宿ったという設定。","formats":["buzzer","flip","choice4"],"choices":["和田どん","和田かつ","太田どん","和田ぽん"],"expected_correct_rate":0.58},{"id":"ent-605","genre":"entertainment","question":"井上雄彦（いのうえたけひこ）のバスケ漫画「SLAM DUNK（スラムダンク）」。主人公・桜木花道（さくらぎはなみち）が通う、神奈川県立の高校の名前は何高校？","answer":"湘北高校","accept_rule":"「湘北」で正解。ひらがな可","explanation":"赤木・流川・三井・宮城らが所属。神奈川のライバルは「王者」海南大附属、翔陽、陵南。","formats":["buzzer","flip"],"expected_correct_rate":0.64},{"id":"ent-606","genre":"entertainment","question":"国民的RPG「ドラゴンクエスト」シリーズ。スライムをはじめとするモンスターや主人公たちのキャラクターデザインを、第1作から手がけてきた漫画家は誰？","answer":"鳥山明","accept_rule":"「鳥山」のみでも可","explanation":"ゲームデザインの堀井雄二、音楽のすぎやまこういちと合わせて「ドラクエ御三家」と呼ばれた。","formats":["buzzer","flip"],"expected_correct_rate":0.63},{"id":"food-601","genre":"food","question":"鶏肉と卵を使うから「親子丼」。では、鶏肉の代わりに豚肉や牛肉を卵でとじた丼。親子丼にちなんだ名前で何丼という？","answer":"他人丼","accept_rule":"「他人丼」正解。関東の別名「開化丼（かいかどん）」も可","explanation":"肉と卵は親子ではないので「他人」。関東では文明開化にちなんで「開化丼」とも。関西では牛肉で作るのが主流。","formats":["buzzer","flip"],"expected_correct_rate":0.6},{"id":"food-602","genre":"food","question":"どちらも「コーヒー牛乳」の意味。フランス語の「カフェ・オ・レ」はドリップコーヒーを使うのに対し、イタリア語の「カフェ・ラテ」は何で淹れたコーヒーを使う？","answer":"エスプレッソ","accept_rule":"「エスプレッソ」が入っていれば正解","explanation":"エスプレッソは量が少なく濃いので、ラテはミルクの割合が多い（目安はオレ1:1、ラテ1:4）。","formats":["buzzer","flip"],"expected_correct_rate":0.6},{"id":"food-603","genre":"food","question":"福岡名物「辛子明太子（めんたいこ）」。「明太（めんたい）」とは朝鮮語で、タラの仲間の魚のこと。何という魚？","answer":"スケトウダラ","accept_rule":"「スケトウダラ」「スケソウダラ」で正解。「タラ」「マダラ」は不正解","explanation":"朝鮮語でスケトウダラは「明太（ミョンテ）」。その子（卵）だから明太子。たらこも同じ魚の卵。","formats":["buzzer","flip"],"expected_correct_rate":0.57},{"id":"food-604","genre":"food","question":"亀田製菓のロングセラーせんべい「ハッピーターン」。甘じょっぱい味の決め手である、表面にまぶされた「あの粉」の公式の名前は何？","answer":"ハッピーパウダー","accept_rule":"「ハッピーパウダー」のみ正解。「魔法の粉」などは不可","explanation":"公式に「ハッピーパウダー」と命名されている。粉が通常の2.5倍付いた「パウダー250%」などの派生商品も人気。","formats":["buzzer","flip"],"expected_correct_rate":0.62},{"id":"food-605","genre":"food","question":"卵とチーズ、黒こしょうで作るパスタ「カルボナーラ」。イタリア語の「カルボーネ（炭）」に由来する名前で、直訳すると「何風」のパスタ？","answer":"炭焼き職人風","accept_rule":"「炭焼き」が入っていれば正解","explanation":"黒こしょうを炭の粉に見立てたなど由来は諸説あり。ちなみにペスカトーレは「漁師風」、カチャトーラは「猟師風」。","formats":["buzzer","flip","choice4"],"choices":["炭焼き職人風","漁師風","猟師風","田舎風"],"expected_correct_rate":0.47},{"id":"food-606","genre":"food","question":"スターバックスのドリンクサイズ「ショート」「トール」「グランデ」「ベンティ」。いちばん大きい「ベンティ」は、イタリア語で数字のいくつを意味する？","answer":"20","accept_rule":"「20」で正解","explanation":"venti（ヴェンティ）＝イタリア語で20。容量が約20オンス（約590ml）あることから。グランデは「大きい」の意味。","formats":["buzzer","flip","choice4"],"choices":["12","16","20","24"],"expected_correct_rate":0.45},{"id":"life-601","genre":"life_brand","question":"返礼品で人気の「ふるさと納税」。控除の上限額の範囲内なら、寄付した額のうち何円を超える分が、所得税と住民税から控除される？","answer":"2000円","accept_rule":"「2000円」のみ正解","explanation":"いくつの自治体に寄付しても自己負担は合計2000円。2026年度の税制改正で高所得者の控除に定額の上限が設けられたが、2000円の自己負担は変わらない。","formats":["buzzer","flip"],"valid_until":"2028-12-31","expected_correct_rate":0.6},{"id":"life-602","genre":"life_brand","question":"Amazon（アマゾン）のロゴ。社名の下に描かれた、笑顔の口のようにも見える矢印は、アルファベットのどの文字からどの文字へ向かっている？","answer":"aからz（AからZ）","accept_rule":"「AからZ」の趣旨であれば正解","explanation":"「AからZまで何でも揃う」と顧客の笑顔を表現。2000年に発表された現ロゴのデザイン。","formats":["buzzer","flip"],"expected_correct_rate":0.6},{"id":"life-603","genre":"life_brand","question":"求人紹介や失業手当の手続きで訪れる国の機関「ハローワーク」。「ハローワーク」は一般公募で決まった愛称ですが、正式名称は何？","answer":"公共職業安定所","accept_rule":"「公共職業安定所」正解。「職業安定所」も可。「職安」のみは不可","explanation":"厚生労働省が所管。1990年に愛称を公募して「ハローワーク」に。略称は「職安」。","formats":["buzzer","flip"],"expected_correct_rate":0.58},{"id":"life-604","genre":"life_brand","question":"東京ディズニーランドと東京ディズニーシーは、ディズニー社の直営ではなく、ライセンス契約を結んだ日本の会社が運営している。千葉県浦安市に本社を置くその会社は？","answer":"オリエンタルランド","accept_rule":"「オリエンタルランド」のみ正解","explanation":"1960年に京成電鉄・三井不動産などの出資で設立。1979年に米ディズニーとライセンス契約を結んだ。","formats":["buzzer","flip"],"expected_correct_rate":0.6},{"id":"life-605","genre":"life_brand","question":"ディスカウントストア「ドン・キホーテ」の看板や店内で見かける、ナイトキャップをかぶった青いペンギンのマスコット。その名前は？","answer":"ドンペン","accept_rule":"「ドンペン」のみ正解。ピンクのペンギン「ドンコ」は別のキャラクターなので不可","explanation":"南極生まれ東京育ち。2022年12月にキャラ交代を発表したが、反響の大きさから同じ日のうちに撤回し、続投に。","formats":["buzzer","flip"],"expected_correct_rate":0.58},{"id":"life-606","genre":"life_brand","question":"「ウォシュレット」は温水洗浄便座の一般名称ではなく、あるメーカーの登録商標。そのメーカーはどこ？","answer":"TOTO","accept_rule":"「TOTO」正解。旧社名「東陶（機器）」も可","explanation":"一般名称は「温水洗浄便座」。LIXILは「シャワートイレ」、パナソニックは「ビューティ・トワレ」。","formats":["buzzer","flip","choice4"],"choices":["TOTO","LIXIL","パナソニック","東芝"],"expected_correct_rate":0.62},{"id":"life-607","genre":"life_brand","question":"全国にショッピングモールを展開する「イオン株式会社」。2001年に「イオン」へ社名変更するまで名乗っていた、総合スーパーの屋号としても使われた旧社名は？","answer":"ジャスコ","accept_rule":"「ジャスコ」のみ正解","explanation":"JUSCO＝Japan United Stores Companyの略。店名も2011年に「イオン」へ統一され、ジャスコの看板は消えた。","formats":["buzzer","flip"],"expected_correct_rate":0.7},{"id":"kanji-601","genre":"kanji_words","question":"フリップに漢字で書いてください。天候の「えいきょう」で電車が遅れる、の「えいきょう」。","display":"天候の えいきょう で電車が遅れる","answer":"影響","accept_rule":"「影響」のみ正解。とめ・はね不問","explanation":"「響」の下は「音」。上の「郷」の中央部分が崩れやすいので注意。","formats":["flip"],"expected_correct_rate":0.58},{"id":"kanji-602","genre":"kanji_words","question":"フリップに漢字で書いてください。話の「むじゅん」を指摘する、の「むじゅん」。","display":"話の むじゅん を指摘する","answer":"矛盾","accept_rule":"「矛盾」のみ正解。とめ・はね不問","explanation":"「ほこ」と「たて」。どんな盾も貫く矛と、どんな矛も防ぐ盾を同時に売った故事（韓非子）から。","formats":["flip"],"expected_correct_rate":0.62},{"id":"kanji-603","genre":"kanji_words","question":"画面の漢字は、ある果物の名前。何と読む？","display":"無花果","answer":"いちじく","accept_rule":"「いちじく」のみ正解。字面のままの読み「むかか」は不可","explanation":"花が実の内側に咲いて外から見えないため「花の無い果実」と書く。","formats":["flip","buzzer"],"expected_correct_rate":0.64},{"id":"kanji-604","genre":"kanji_words","question":"画面の漢字は、天気予報やお断りの場面でよく使う言葉。何と読む？","display":"生憎","answer":"あいにく","accept_rule":"「あいにく」のみ正解","explanation":"「ああ、憎い」が縮まった「あやにく」が語源。「生」は当て字。","formats":["flip","buzzer"],"expected_correct_rate":0.6},{"id":"kanji-605","genre":"kanji_words","question":"「中途半端でどちらの役にも立たない」という意味のことわざ、「○に短し、たすきに長し」。○に入る漢字1文字は？","display":"○ に短し、たすきに長し","answer":"帯","accept_rule":"「帯」正解。ひらがな「おび」も可","explanation":"一本の布が、帯にするには短く、たすきにするには長すぎる、ということ。","formats":["buzzer","flip"],"expected_correct_rate":0.7},{"id":"rid-601","genre":"riddle","question":"画面の文字は、ある4文字の言葉を表しています。何？","answer":"さかさま","accept_rule":"「さかさま（逆さま）」正解。「ま」が逆→「まぎゃく（真逆）」も判じ絵として成立する4文字なので正解。「さかさ」「ひっくり返し」など4文字でないものは不正解。「ま」だけも不正解","explanation":"「ま」が逆さまになっているので「さかさ・ま」。文字そのものがヒントの判じ絵。","formats":["flip","image"],"conflicts_with":["rid-115","rid-116","rid-117"],"expected_correct_rate":0.64,"image_svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 400 300\"><rect width=\"400\" height=\"300\" fill=\"#ffffff\"/><text x=\"200\" y=\"150\" font-size=\"200\" font-weight=\"bold\" fill=\"#1a1a1a\" text-anchor=\"middle\" dominant-baseline=\"central\" transform=\"rotate(180 200 150)\">ま<\/text><\/svg>"},{"id":"rid-602","genre":"riddle","question":"画面のひらがな8個は、ある法則で並んでいます。「？」に入るひらがなは何？","display":"す　き　ち　か　も　ど　て　？","answer":"か","accept_rule":"「か」のみ正解（「海王星」と書いても正解）","explanation":"水・金・地・火・木・土・天・海。太陽系の惑星を太陽に近い順に並べた頭文字。最後は海王星の「か」。","formats":["flip"],"conflicts_with":["rid-105","rid-106","rid-107","rid-110"],"expected_correct_rate":0.58},{"id":"rid-603","genre":"riddle","question":"3つの数を全部足しても、全部かけ算しても、答えが同じになる。そんな1以上の整数3つの組み合わせは？","display":"□＋□＋□ ＝ □×□×□\n（1以上の整数）","answer":"1・2・3","accept_rule":"「1・2・3」の3つがそろっていれば正解（順不同）","explanation":"1＋2＋3＝6、1×2×3＝6。1以上の整数ではこの組み合わせしかない。","formats":["flip"],"expected_correct_rate":0.63},{"id":"rid-604","genre":"riddle","question":"机に置いたサイコロを上からのぞくと、上の面と横の4面、合わせて5面が見えます。見えている5面の目の合計は、最大でいくつ？","display":"サイコロの見える5面\n目の合計は最大いくつ？","answer":"20","accept_rule":"「20」のみ正解。near形式なら最も近いチーム","explanation":"1〜6を全部足すと21。見えないのは底の1面だけなので、底を「1」にすれば21－1＝20。","formats":["flip","near"],"expected_correct_rate":0.57},{"id":"rid-605","genre":"riddle","question":"画面のカレンダーには、ひとつだけ「ありえないこと」があります。どこ？","answer":"4月31日がある","accept_rule":"「31日（4月は30日まで）」を指摘できていれば正解","explanation":"4月は30日まで。「西向く士（にしむくさむらい）＝2・4・6・9・11月は31日がない」。曜日・祝日（29日 昭和の日）は2026年4月のとおり。","formats":["flip","image"],"expected_correct_rate":0.6,"image_svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 560 430\"><rect width=\"560\" height=\"430\" fill=\"#ffffff\"/><text x=\"280\" y=\"58\" font-size=\"40\" font-weight=\"bold\" fill=\"#1a1a1a\" text-anchor=\"middle\">2026年 4月<\/text><text x=\"70\" y=\"95\" font-size=\"26\" font-weight=\"bold\" fill=\"#d81e1e\" text-anchor=\"middle\">日<\/text><text x=\"140\" y=\"95\" font-size=\"26\" font-weight=\"bold\" fill=\"#1a1a1a\" text-anchor=\"middle\">月<\/text><text x=\"210\" y=\"95\" font-size=\"26\" font-weight=\"bold\" fill=\"#1a1a1a\" text-anchor=\"middle\">火<\/text><text x=\"280\" y=\"95\" font-size=\"26\" font-weight=\  fill=\"#1a1a1a\" text-anchor=\"middle\">17<\/text><text x=\"490\" y=\"268\" font-size=\"30\" fill=\"#1e5bd8\" text-anchor=\"middle\">18<\/text><text x=\"70\" y=\"326\" font-size=\"30\" fill=\"#d81e1e\" text-anchor=\"middle\">19<\/text><text x=\"140\" y=\"326\" font-size=\"30\" fill=\"#1a1a1a\" text-anchor=\"middle\">20<\/text><text x=\"210\" y=\"326\" font-size=\"30\" fill=\"#1a1a1a\" text-anchor=\"middle\">21<\/text><text x=\"280\" y=\"326\" font-size=\"30\" fill=\"#1a1a1a\" text-anchor=\"middle\">22<\/text><text x=\"350\" y=\"326\" font-size=\"30\" fill=\"#1a1a1a\" text-anchor=\"middle\">23<\/text><text x=\"420\" y=\"326\" font-size=\"30\" fill=\"#1a1a1a\" text-anchor=\"middle\">24<\/text><text x=\"490\" y=\"326\" font-size=\"30\" fill=\"#1e5bd8\" text-anchor=\"middle\">25<\/text><text x=\"70\" y=\"384\" font-size=\"30\" fill=\"#d81e1e\" text-anchor=\"middle\">26<\/text><text x=\"140\" y=\"384\" font-size=\"30\" fill=\"#1a1a1a\" text-anchor=\"middle\">27<\/text><text x=\"210\" y=\"384\" font-size=\"30\" fill=\"#1a1a1a\" text-anchor=\"middle\">28<\/text><text x=\"280\" y=\"384\" font-size=\"30\" fill=\"#d81e1e\" text-anchor=\"middle\">29<\/text><text x=\"350\" y=\"384\" font-size=\"30\" fill=\"#1a1a1a\" text-anchor=\"middle\">30<\/text><text x=\"420\" y=\"384\" font-size=\"30\" fill=\"#1a1a1a\" text-anchor=\"middle\">31<\/text><\/svg>"},{"id":"rid-606","genre":"riddle","question":"画面はサイコロ型の箱の展開図です。組み立てたとき、「A」の面の反対側（向かい）にくるのはどの面？","answer":"E","accept_rule":"「E」のみ正解","explanation":"十字の展開図では、1マスおきに並ぶ面どうしが向かい合う。AとE、BとD、CとFがそれぞれ反対の面。","formats":["flip","image"],"expected_correct_rate":0.46,"image_svg":"<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 440 400\"><rect width=\"440\" height=\"400\" fill=\"#ffffff\"/><rect x=\"175\" y=\"20\" width=\"90\" height=\"90\" fill=\"#eaf2ff\" stroke=\"#1a1a1a\" stroke-width=\"6\"/><text x=\"220\" y=\"65\" font-size=\"52\" font-weight=\"bold\" fill=\"#1a1a1a\" text-anchor=\"middle\" dominant-baseline=\"central\">A<\/text><re
